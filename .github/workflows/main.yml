name: Build Zeeshan Mic Assistant APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: Generate Build Configurations
        run: |
          set -euo pipefail
          mkdir -p app/src/main/java/com/zeeshan/micassistant
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/layout

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.daemon=false
          EOF

          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "ZeeshanMicAssistant"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id "com.android.application" version "8.2.2" apply false
              id "org.jetbrains.kotlin.android" version "1.9.22" apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id "com.android.application"
              id "org.jetbrains.kotlin.android"
          }
          android {
              namespace "com.zeeshan.micassistant"
              compileSdk 34
              defaultConfig {
                  applicationId "com.zeeshan.micassistant"
                  minSdk 26
                  targetSdk 34
                  versionCode 20
                  versionName "20.0"
              }
              buildTypes { release { minifyEnabled false } }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation "androidx.core:core-ktx:1.13.1"
              implementation "androidx.appcompat:appcompat:1.7.0"
              implementation "com.google.android.material:material:1.12.0"
          }
          EOF

      - name: Generate App Resources & Manifest
        run: |
          set -euo pipefail

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Zeeshan Assistant Call</string>
          </resources>
          EOF

          cat > app/src/main/res/drawable/ic_app_icon.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path android:fillColor="#1E3A8A" android:pathData="M4,2h16c1.1,0 2,0.9 2,2v16c0,1.1 -0.9,2 -2,2H4c-1.1,0 -2,-0.9 -2,-2V4c0,-1.1 0.9,-2 2,-2z"/>
              <path android:fillColor="#3B82F6" android:pathData="M6,4h12c1.1,0 2,0.9 2,2v12c0,1.1 -0.9,2 -2,2H6c-1.1,0 -2,-0.9 -2,-2V6c0,-1.1 0.9,-2 2,-2z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M6.62,10.79c1.44,2.83 3.76,5.14 6.59,6.59l2.2,-2.2c0.27,-0.27 0.67,-0.36 1.02,-0.24 1.12,0.37 2.33,0.57 3.57,0.57 0.55,0 1,0.45 1,1V20c0,0.55 -0.45,1 -1,1 -9.39,0 -17,-7.61 -17,-17 0,-0.55 0.45,-1 1,-1h3.5c0.55,0 1,0.45 1,1 0,1.25 0.2,2.45 0.57,3.57 0.11,0.35 0.03,0.74 -0.25,1.02l-2.2,2.2z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M15.5,8.5C16.3,9.3 16.8,10.4 16.8,11.5s-0.5,2.2 -1.3,3l1.1,1.1c1.2,-1.4 1.9,-3.1 1.9,-5.1s-0.7,-3.7 -1.9,-5.1l-1.1,1.1z"/>
          </vector>
          EOF

          cat > app/src/main/res/drawable/circle_mic_normal.xml <<'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
              <gradient android:type="radial" android:gradientRadius="110dp" android:startColor="#60A5FA" android:centerColor="#2563EB" android:endColor="#1E3A8A" />
              <stroke android:width="5dp" android:color="#93C5FD" />
          </shape>
          EOF

          cat > app/src/main/res/drawable/circle_mic_active.xml <<'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
              <gradient android:type="radial" android:gradientRadius="110dp" android:startColor="#4ADE80" android:centerColor="#16A34A" android:endColor="#14532D" />
              <stroke android:width="5dp" android:color="#86EFAC" />
          </shape>
          EOF

          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:background="#F8FAFC">

              <!-- Top Header Bar -->
              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="70dp"
                  android:background="#1E3A8A"
                  android:gravity="center_vertical"
                  android:paddingHorizontal="20dp"
                  android:elevation="6dp">
                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Zeeshan Assistant Call"
                      android:textColor="#FFFFFF"
                      android:textSize="20sp"
                      android:textStyle="bold" />
              </LinearLayout>

              <!-- Center Single-Screen Layout -->
              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1"
                  android:orientation="vertical"
                  android:gravity="center"
                  android:padding="24dp">

                  <TextView
                      android:id="@+id/statusTitleTv"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Zeeshan Assistant is Ready"
                      android:textSize="18sp"
                      android:textColor="#1E3A8A"
                      android:textStyle="bold"
                      android:gravity="center"
                      android:layout_marginBottom="12dp" />

                  <TextView
                      android:id="@+id/statusDescTv"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Tap the mic and say 'Call [Name]'"
                      android:textSize="15sp"
                      android:textColor="#64748B"
                      android:gravity="center"
                      android:layout_marginBottom="40dp" />

                  <!-- Centered Big Mic Button -->
                  <ImageButton
                      android:id="@+id/btnMic"
                      android:layout_width="160dp"
                      android:layout_height="160dp"
                      android:background="@drawable/circle_mic_normal"
                      android:src="@android:drawable/ic_btn_speak_now"
                      android:scaleType="centerInside"
                      android:elevation="18dp"
                      android:contentDescription="Assistant Mic"
                      android:layout_marginBottom="40dp" />

                  <!-- Audio Wave Animation Indicator -->
                  <TextView
                      android:id="@+id/waveTv"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text=" ıllılıl llılıll "
                      android:textSize="32sp"
                      android:textColor="#2563EB"
                      android:gravity="center" />

              </LinearLayout>

              <!-- Bottom Footer Bar -->
              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="65dp"
                  android:background="#1E3A8A"
                  android:gravity="center"
                  android:elevation="8dp">
                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="100% Offline-First Voice Assistant"
                      android:textColor="#93C5FD"
                      android:textSize="13sp"
                      android:textStyle="bold" />
              </LinearLayout>

          </LinearLayout>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.READ_CONTACTS" />
              <uses-permission android:name="android.permission.READ_CALL_LOG" />
              <uses-permission android:name="android.permission.CALL_PHONE" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />

              <application
                  android:allowBackup="false"
                  android:icon="@drawable/ic_app_icon"
                  android:roundIcon="@drawable/ic_app_icon"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Write Pure Kotlin MainActivity.kt with Single-Screen VIP Engine
        run: |
          cat > app/src/main/java/com/zeeshan/micassistant/MainActivity.kt <<'EOF'
          package com.zeeshan.micassistant

          import android.Manifest
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.database.Cursor
          import android.net.Uri
          import android.os.Bundle
          import android.provider.CallLog
          import android.provider.ContactsContract
          import android.speech.RecognitionListener
          import android.speech.RecognizerIntent
          import android.speech.SpeechRecognizer
          import android.speech.tts.TextToSpeech
          import android.widget.ImageButton
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat
          import java.util.*

          data class ContactItem(val name: String, val phone: String)

          class MainActivity : AppCompatActivity(), TextToSpeech.OnInitListener {

              private lateinit var btnMic: ImageButton
              private lateinit var statusTitleTv: TextView
              private lateinit var statusDescTv: TextView
              private lateinit var waveTv: TextView

              private lateinit var speechRecognizer: SpeechRecognizer
              private lateinit var textToSpeech: TextToSpeech

              val allContacts = mutableListOf<ContactItem>()

              companion object {
                  private const val PERMISSION_REQUEST_CODE = 101
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  btnMic = findViewById(R.id.btnMic)
                  statusTitleTv = findViewById(R.id.statusTitleTv)
                  statusDescTv = findViewById(R.id.statusDescTv)
                  waveTv = findViewById(R.id.waveTv)

                  checkPermissions()
                  syncAllData()

                  textToSpeech = TextToSpeech(this, this)
                  setupSpeechRecognizer()

                  btnMic.setOnClickListener {
                      startListeningProcess()
                  }
              }

              private fun checkPermissions() {
                  val permissions = arrayOf(
                      Manifest.permission.READ_CONTACTS,
                      Manifest.permission.READ_CALL_LOG,
                      Manifest.permission.CALL_PHONE,
                      Manifest.permission.RECORD_AUDIO
                  )
                  ActivityCompat.requestPermissions(this, permissions, PERMISSION_REQUEST_CODE)
              }

              fun syncAllData() {
                  allContacts.clear()

                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_CONTACTS) == PackageManager.PERMISSION_GRANTED) {
                      val cursor: Cursor? = contentResolver.query(
                          ContactsContract.CommonDataKinds.Phone.CONTENT_URI,
                          null, null, null, ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME + " ASC"
                      )
                      cursor?.let {
                          val nameIdx = it.getColumnIndex(ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME)
                          val numIdx = it.getColumnIndex(ContactsContract.CommonDataKinds.Phone.NUMBER)
                          while (it.moveToNext()) {
                              val name = it.getString(nameIdx) ?: ""
                              val num = it.getString(numIdx) ?: ""
                              if (name.isNotEmpty() && num.isNotEmpty()) {
                                  if (!allContacts.any { c -> c.phone == num }) {
                                      allContacts.add(ContactItem(name, num))
                                  }
                              }
                          }
                          it.close()
                      }
                  }

                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_CALL_LOG) == PackageManager.PERMISSION_GRANTED) {
                      val logCursor: Cursor? = contentResolver.query(
                          CallLog.Calls.CONTENT_URI,
                          arrayOf(CallLog.Calls.CACHED_NAME, CallLog.Calls.NUMBER),
                          null, null, CallLog.Calls.DATE + " DESC"
                      )
                      logCursor?.let {
                          val nameIdx = logCursor.getColumnIndex(CallLog.Calls.CACHED_NAME)
                          val numIdx = logCursor.getColumnIndex(CallLog.Calls.NUMBER)
                          while (logCursor.moveToNext()) {
                              val name = logCursor.getString(nameIdx) ?: "Unknown Caller"
                              val num = logCursor.getString(numIdx) ?: ""
                              if (num.isNotEmpty() && !allContacts.any { c -> c.phone == num }) {
                                  allContacts.add(ContactItem(name, num))
                              }
                          }
                          logCursor.close()
                      }
                  }
              }

              private fun setupSpeechRecognizer() {
                  if (SpeechRecognizer.isRecognitionAvailable(this)) {
                      speechRecognizer = SpeechRecognizer.createSpeechRecognizer(this)
                      speechRecognizer.setRecognitionListener(object : RecognitionListener {
                          override fun onReadyForSpeech(params: Bundle?) {
                              statusTitleTv.text = "Listening..."
                              statusDescTv.text = "Speak contact name with 'Call'..."
                              waveTv.text = " 🌈✨ ıllılıl llılıll ✨🌈 "
                          }
                          override fun onBeginningOfSpeech() {}
                          override fun onRmsChanged(rmsdB: Float) {}
                          override fun onBufferReceived(buffer: ByteArray?) {}
                          override fun onEndOfSpeech() {
                              statusTitleTv.text = "Processing..."
                              statusDescTv.text = "Searching contacts offline..."
                          }
                          override fun onError(error: Int) {
                              resetMicState()
                              statusTitleTv.text = "Voice not detected"
                              statusDescTv.text = "Tap mic to try again."
                              Toast.makeText(this@MainActivity, "Voice not detected. Try again.", Toast.LENGTH_SHORT).show()
                          }
                          override fun onResults(results: Bundle?) {
                              resetMicState()
                              val matches = results?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)
                              if (!matches.isNullOrEmpty()) {
                                  processCommand(matches[0])
                              }
                          }
                          override fun onPartialResults(partialResults: Bundle?) {}
                          override fun onEvent(eventType: Int, params: Bundle?) {}
                      })
                  }
              }

              private fun startListeningProcess() {
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED) {
                      btnMic.setBackgroundResource(R.drawable.circle_mic_active)
                      val intent = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                          putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                          putExtra(RecognizerIntent.EXTRA_LANGUAGE, "en-US")
                          putExtra(RecognizerIntent.EXTRA_PREFER_OFFLINE, true)
                      }
                      try {
                          speechRecognizer.startListening(intent)
                      } catch (e: Exception) {
                          resetMicState()
                          Toast.makeText(this, "Microphone busy. Try again.", Toast.LENGTH_SHORT).show()
                      }
                  } else {
                      checkPermissions()
                  }
              }

              private fun resetMicState() {
                  btnMic.setBackgroundResource(R.drawable.circle_mic_normal)
                  waveTv.text = " ıllılıl llılıll "
              }

              private fun processCommand(spokenText: String) {
                  val rawText = spokenText.trim()
                  val lowerText = rawText.lowercase(Locale.ROOT)

                  val hasCallKeyword = lowerText.contains("call")
                  val searchName = lowerText.replace("call", "").trim()

                  if (searchName.isEmpty()) {
                      statusTitleTv.text = "You said: \"$rawText\""
                      statusDescTv.text = "Say 'Call [Name]' to dial."
                      speakOut("You said $rawText")
                      return
                  }

                  val matched = allContacts.filter { contact ->
                      val cName = contact.name.lowercase(Locale.ROOT)
                      cName.contains(searchName) || searchName.contains(cName) || contact.phone.contains(searchName) ||
                      cName.split(" ").any { searchName.contains(it) && it.length > 1 }
                  }

                  when {
                      matched.isEmpty() -> {
                          statusTitleTv.text = "No contact found"
                          statusDescTv.text = "No match for \"$searchName\""
                          speakOut("No contact found.")
                      }
                      matched.size == 1 -> {
                          val target = matched[0]
                          if (hasCallKeyword) {
                              statusTitleTv.text = "Calling ${target.name}..."
                              statusDescTv.text = target.phone
                              speakOut("Calling ${target.name}")
                              makePhoneCall(target.phone)
                          } else {
                              statusTitleTv.text = "Found: ${target.name}"
                              statusDescTv.text = "Say 'Call ${target.name}' to dial."
                              speakOut("Found ${target.name}. Say call to dial.")
                          }
                      }
                      else -> {
                          statusTitleTv.text = "Found ${matched.size} contacts"
                          var speechText = "Found ${matched.size} contacts. "
                          matched.forEachIndexed { idx, contact ->
                              speechText += "Number ${idx + 1}: ${contact.name}. "
                          }
                          statusDescTv.text = speechText
                          speakOut(speechText)
                      }
                  }
              }

              private fun speakOut(text: String) {
                  textToSpeech.speak(text, TextToSpeech.QUEUE_FLUSH, null, "")
              }

              private fun makePhoneCall(phoneNumber: String) {
                  val intent = Intent(Intent.ACTION_CALL).apply {
                      data = Uri.parse("tel:$phoneNumber")
                  }
                  if (ActivityCompat.checkSelfPermission(this, Manifest.permission.CALL_PHONE) == PackageManager.PERMISSION_GRANTED) {
                      startActivity(intent)
                  }
              }

              override fun onInit(status: Int) {
                  if (status == TextToSpeech.SUCCESS) {
                      textToSpeech.language = Locale("en", "US")
                  }
              }

              override fun onDestroy() {
                  if (::speechRecognizer.isInitialized) {
                      speechRecognizer.destroy()
                  }
                  if (::textToSpeech.isInitialized) {
                      textToSpeech.stop()
                      textToSpeech.shutdown()
                  }
                  super.onDestroy()
              }
          }
          EOF

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Z-Plus-2-Assistant-Call-APK
          path: app/build/outputs/apk/debug/app-debug.apk

