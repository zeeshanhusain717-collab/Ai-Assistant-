name: Build Zeeshan Mic Assistant APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: Generate Build Configurations
        run: |
          set -euo pipefail
          mkdir -p app/src/main/java/com/zeeshan/micassistant
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/layout

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.daemon=false
          EOF

          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "ZeeshanMicAssistant"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id "com.android.application" version "8.2.2" apply false
              id "org.jetbrains.kotlin.android" version "1.9.22" apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id "com.android.application"
              id "org.jetbrains.kotlin.android"
          }
          android {
              namespace "com.zeeshan.micassistant"
              compileSdk 34
              defaultConfig {
                  applicationId "com.zeeshan.micassistant"
                  minSdk 26
                  targetSdk 34
                  versionCode 11
                  versionName "11.0"
              }
              buildTypes { release { minifyEnabled false } }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation "androidx.core:core-ktx:1.13.1"
              implementation "androidx.appcompat:appcompat:1.7.0"
              implementation "com.google.android.material:material:1.12.0"
              implementation "androidx.viewpager2:viewpager2:1.1.0"
          }
          EOF

      - name: Generate App Resources & Manifest
        run: |
          set -euo pipefail

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Z + 2 Assistant Call</string>
          </resources>
          EOF

          # 🟢 3D Metallic Green App Icon matching screenshot
          cat > app/src/main/res/drawable/ic_app_icon.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path android:fillColor="#042F26" android:pathData="M4,2h16c1.1,0 2,0.9 2,2v16c0,1.1 -0.9,2 -2,2H4c-1.1,0 -2,-0.9 -2,-2V4c0,-1.1 0.9,-2 2,-2z"/>
              <path android:fillColor="#059669" android:pathData="M6,4h12c1.1,0 2,0.9 2,2v12c0,1.1 -0.9,2 -2,2H6c-1.1,0 -2,-0.9 -2,-2V6c0,-1.1 0.9,-2 2,-2z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M6.62,10.79c1.44,2.83 3.76,5.14 6.59,6.59l2.2,-2.2c0.27,-0.27 0.67,-0.36 1.02,-0.24 1.12,0.37 2.33,0.57 3.57,0.57 0.55,0 1,0.45 1,1V20c0,0.55 -0.45,1 -1,1 -9.39,0 -17,-7.61 -17,-17 0,-0.55 0.45,-1 1,-1h3.5c0.55,0 1,0.45 1,1 0,1.25 0.2,2.45 0.57,3.57 0.11,0.35 0.03,0.74 -0.25,1.02l-2.2,2.2z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M15.5,8.5C16.3,9.3 16.8,10.4 16.8,11.5s-0.5,2.2 -1.3,3l1.1,1.1c1.2,-1.4 1.9,-3.1 1.9,-5.1s-0.7,-3.7 -1.9,-5.1l-1.1,1.1z"/>
          </vector>
          EOF

          # 🌟 3D Neon Glowing Normal Mic Button
          cat > app/src/main/res/drawable/circle_mic_normal.xml <<'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
              <gradient android:type="radial" android:gradientRadius="90dp" android:startColor="#34D399" android:centerColor="#059669" android:endColor="#022C22" />
              <stroke android:width="4dp" android:color="#6EE7B7" />
          </shape>
          EOF

          # 🔥 3D Neon Active Mic Button
          cat > app/src/main/res/drawable/circle_mic_active.xml <<'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
              <gradient android:type="radial" android:gradientRadius="90dp" android:startColor="#F43F5E" android:centerColor="#E11D48" android:endColor="#4C0519" />
              <stroke android:width="4dp" android:color="#FDA4AF" />
          </shape>
          EOF

          # 🧊 3D Glassmorphism Card Background
          cat > app/src/main/res/drawable/card_background.xml <<'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#CC022C22" />
              <corners android:radius="18dp" />
              <stroke android:width="1.5dp" android:color="#34D399" />
          </shape>
          EOF

          cat > app/src/main/res/drawable/list_background.xml <<'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#021C16" />
              <corners android:radius="16dp" />
              <stroke android:width="1dp" android:color="#059669" />
          </shape>
          EOF

          # 🎨 Bottom Tab Card Style (Rounded Pill Container as in image)
          cat > app/src/main/res/drawable/tab_card_background.xml <<'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#042F26" />
              <corners android:radius="16dp" />
              <stroke android:width="1.5dp" android:color="#059669" />
          </shape>
          EOF

          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:background="#011F18">

              <!-- 3D Header Bar with White Rounded App Icon Card -->
              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="75dp"
                  android:background="#022C22"
                  android:gravity="center_vertical"
                  android:paddingHorizontal="16dp"
                  android:elevation="8dp">
                  
                  <LinearLayout
                      android:layout_width="50dp"
                      android:layout_height="50dp"
                      android:background="@drawable/card_background"
                      android:gravity="center"
                      android:layout_marginEnd="14dp"
                      android:elevation="4dp">
                      <ImageView
                          android:layout_width="34dp"
                          android:layout_height="34dp"
                          android:src="@drawable/ic_app_icon"
                          android:contentDescription="App Icon" />
                  </LinearLayout>

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Z + 2 Assistant Call"
                      android:textColor="#FFFFFF"
                      android:textSize="20sp"
                      android:textStyle="bold" />
              </LinearLayout>

              <!-- ViewPager2 for 3D Swipe Screens -->
              <androidx.viewpager2.widget.ViewPager2
                  android:id="@+id/viewPager"
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1" />

              <!-- 3D Floating Bottom Navigation Bar with Image-Matched Rounded Cards -->
              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="85dp"
                  android:background="#022C22"
                  android:orientation="horizontal"
                  android:elevation="14dp"
                  android:gravity="center"
                  android:paddingHorizontal="16dp"
                  android:paddingVertical="12dp">

                  <LinearLayout
                      android:id="@+id/tabAssistantLayout"
                      android:layout_width="0dp"
                      android:layout_height="match_parent"
                      android:layout_weight="1"
                      android:layout_marginEnd="8dp"
                      android:background="@drawable/tab_card_background"
                      android:gravity="center"
                      android:orientation="vertical"
                      android:clickable="true"
                      android:focusable="true"
                      android:elevation="4dp"
                      android:padding="6dp">
                      <ImageView
                          android:layout_width="22dp"
                          android:layout_height="22dp"
                          android:src="@drawable/ic_app_icon"
                          android:contentDescription="Assistant Icon" />
                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="Z ASSISTANT"
                          android:textColor="#34D399"
                          android:textSize="11sp"
                          android:textStyle="bold"
                          android:layout_marginTop="2dp" />
                  </LinearLayout>

                  <LinearLayout
                      android:id="@+id/tabContactsLayout"
                      android:layout_width="0dp"
                      android:layout_height="match_parent"
                      android:layout_weight="1"
                      android:layout_marginStart="8dp"
                      android:background="@drawable/tab_card_background"
                      android:gravity="center"
                      android:orientation="vertical"
                      android:clickable="true"
                      android:focusable="true"
                      android:elevation="4dp"
                      android:padding="6dp">
                      <ImageView
                          android:layout_width="22dp"
                          android:layout_height="22dp"
                          android:src="@android:drawable/ic_menu_my_calendar"
                          android:tint="#34D399"
                          android:contentDescription="Contacts Icon" />
                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="CONTACTS"
                          android:textColor="#34D399"
                          android:textSize="11sp"
                          android:textStyle="bold"
                          android:layout_marginTop="2dp" />
                  </LinearLayout>

              </LinearLayout>

          </LinearLayout>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.READ_CONTACTS" />
              <uses-permission android:name="android.permission.READ_CALL_LOG" />
              <uses-permission android:name="android.permission.CALL_PHONE" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />

              <application
                  android:allowBackup="false"
                  android:icon="@drawable/ic_app_icon"
                  android:roundIcon="@drawable/ic_app_icon"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Write Pure Kotlin MainActivity.kt with Exact Image Layout & Trilingual Speed
        run: |
          cat > app/src/main/java/com/zeeshan/micassistant/MainActivity.kt <<'EOF'
          package com.zeeshan.micassistant

          import android.Manifest
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.database.Cursor
          import android.graphics.Color
          import android.net.Uri
          import android.os.Bundle
          import android.provider.CallLog
          import android.provider.ContactsContract
          import android.speech.RecognitionListener
          import android.speech.RecognizerIntent
          import android.speech.SpeechRecognizer
          import android.speech.tts.TextToSpeech
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat
          import androidx.viewpager2.widget.ViewPager2
          import java.text.Normalizer
          import java.util.*

          data class ContactItem(val name: String, val phone: String)

          class MainActivity : AppCompatActivity(), TextToSpeech.OnInitListener {

              private lateinit var viewPager: ViewPager2
              private lateinit var tabAssistantLayout: LinearLayout
              private lateinit var tabContactsLayout: LinearLayout

              private lateinit var speechRecognizer: SpeechRecognizer
              private lateinit var textToSpeech: TextToSpeech

              val allContacts = mutableListOf<ContactItem>()
              val displayList = ArrayList<String>()
              val fullContactsList = ArrayList<String>()

              var assistantStatusText = "Listening..."
              var isListeningActive = false

              companion object {
                  private const val PERMISSION_REQUEST_CODE = 101
                  lateinit var instance: MainActivity
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  instance = this
                  setContentView(R.layout.activity_main)

                  viewPager = findViewById(R.id.viewPager)
                  tabAssistantLayout = findViewById(R.id.tabAssistantLayout)
                  tabContactsLayout = findViewById(R.id.tabContactsLayout)

                  checkPermissions()
                  syncAllData()

                  textToSpeech = TextToSpeech(this, this)
                  setupSpeechRecognizer()

                  val pagerAdapter = ViewPagerAdapter(this)
                  viewPager.adapter = pagerAdapter

                  viewPager.registerOnPageChangeCallback(object : ViewPager2.OnPageChangeCallback() {
                      override fun onPageSelected(position: Int) {
                          super.onPageSelected(position)
                          if (position == 0) {
                              tabAssistantLayout.setBackgroundResource(R.drawable.tab_card_background)
                              tabContactsLayout.setBackgroundColor(Color.parseColor("#022C22"))
                          } else {
                              tabContactsLayout.setBackgroundResource(R.drawable.tab_card_background)
                              tabAssistantLayout.setBackgroundColor(Color.parseColor("#022C22"))
                          }
                      }
                  })

                  tabAssistantLayout.setOnClickListener { viewPager.currentItem = 0 }
                  tabContactsLayout.setOnClickListener { viewPager.currentItem = 1 }
              }

              private fun checkPermissions() {
                  val permissions = arrayOf(
                      Manifest.permission.READ_CONTACTS,
                      Manifest.permission.READ_CALL_LOG,
                      Manifest.permission.CALL_PHONE,
                      Manifest.permission.RECORD_AUDIO
                  )
                  ActivityCompat.requestPermissions(this, permissions, PERMISSION_REQUEST_CODE)
              }

              fun syncAllData() {
                  allContacts.clear()
                  fullContactsList.clear()

                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_CONTACTS) == PackageManager.PERMISSION_GRANTED) {
                      val cursor: Cursor? = contentResolver.query(
                          ContactsContract.CommonDataKinds.Phone.CONTENT_URI,
                          null, null, null, ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME + " ASC"
                      )
                      cursor?.let {
                          val nameIdx = it.getColumnIndex(ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME)
                          val numIdx = it.getColumnIndex(ContactsContract.CommonDataKinds.Phone.NUMBER)
                          while (it.moveToNext()) {
                              val name = it.getString(nameIdx) ?: ""
                              val num = it.getString(numIdx) ?: ""
                              if (name.isNotEmpty() && num.isNotEmpty()) {
                                  if (!allContacts.any { c -> c.phone == num }) {
                                      allContacts.add(ContactItem(name, num))
                                  }
                              }
                          }
                          it.close()
                      }
                  }

                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_CALL_LOG) == PackageManager.PERMISSION_GRANTED) {
                      val logCursor: Cursor? = contentResolver.query(
                          CallLog.Calls.CONTENT_URI,
                          arrayOf(CallLog.Calls.CACHED_NAME, CallLog.Calls.NUMBER),
                          null, null, CallLog.Calls.DATE + " DESC"
                      )
                      logCursor?.let {
                          val nameIdx = logCursor.getColumnIndex(CallLog.Calls.CACHED_NAME)
                          val numIdx = logCursor.getColumnIndex(CallLog.Calls.NUMBER)
                          while (logCursor.moveToNext()) {
                              val name = logCursor.getString(nameIdx) ?: "Unknown Caller"
                              val num = logCursor.getString(numIdx) ?: ""
                              if (num.isNotEmpty() && !allContacts.any { c -> c.phone == num }) {
                                  allContacts.add(ContactItem(name, num))
                              }
                          }
                          logCursor.close()
                      }
                  }

                  for (contact in allContacts) {
                      fullContactsList.add("📇 ${contact.name}\n📱 ${contact.phone}")
                  }

                  displayList.clear()
                  for (contact in allContacts.take(15)) {
                      displayList.add("📞 ${contact.name} (${contact.phone})")
                  }
              }

              private fun setupSpeechRecognizer() {
                  speechRecognizer = SpeechRecognizer.createSpeechRecognizer(this)
                  speechRecognizer.setRecognitionListener(object : RecognitionListener {
                      override fun onReadyForSpeech(params: Bundle?) {}
                      override fun onBeginningOfSpeech() {}
                      override fun onRmsChanged(rmsdB: Float) {}
                      override fun onBufferReceived(buffer: ByteArray?) {}
                      override fun onEndOfSpeech() {}
                      override fun onError(error: Int) {
                          isListeningActive = false
                          Toast.makeText(this@MainActivity, "Voice not detected. Try again.", Toast.LENGTH_SHORT).show()
                      }
                      override fun onResults(results: Bundle?) {
                          isListeningActive = false
                          val matches = results?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)
                          if (!matches.isNullOrEmpty()) {
                              processUniversalTrilingualCommand(matches[0])
                          }
                      }
                      override fun onPartialResults(partialResults: Bundle?) {}
                      override fun onEvent(eventType: Int, params: Bundle?) {}
                  })
              }

              fun startVoiceListening() {
                  isListeningActive = true
                  val intent = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                      putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                      putExtra(RecognizerIntent.EXTRA_LANGUAGE, "hi-IN")
                  }
                  speechRecognizer.startListening(intent)
              }

              private fun universalPhoneticMatch(input: String, target: String): Boolean {
                  val cleanInput = cleanAndTransliterate(input)
                  val cleanTarget = cleanAndTransliterate(target)
                  return cleanTarget.contains(cleanInput) || cleanInput.contains(cleanTarget)
              }

              private fun cleanAndTransliterate(text: String): String {
                  var normalized = Normalizer.normalize(text.lowercase(Locale.ROOT), Normalizer.Form.NFD)
                      .replace("\\p{InCombiningDiacriticalMarks}+".toRegex(), "")

                  val stopWords = listOf("को", "कॉल", "लगाओ", "फोन", "पर", "call", "to", "phone", "number", "ملاؤ", "فون", "کال")
                  for (word in stopWords) {
                      normalized = normalized.replace(word, "")
                  }
                  return normalized.trim()
              }

              private fun processUniversalTrilingualCommand(command: String) {
                  assistantStatusText = "Searching for \"$command\"..."
                  
                  val matched = allContacts.filter { 
                      universalPhoneticMatch(command, it.name) || it.phone.contains(command.trim())
                  }

                  when {
                      matched.isEmpty() -> {
                          assistantStatusText = "No contact found for \"$command\""
                          speakOut("No contact found.")
                      }
                      matched.size == 1 -> {
                          val target = matched[0]
                          assistantStatusText = "${target.name} Call - Connecting..."
                          displayList.clear()
                          displayList.add("📞 ${target.name} (${target.phone}) - Calling...")
                          speakOut("Calling ${target.name}")
                          makePhoneCall(target.phone)
                      }
                      else -> {
                          assistantStatusText = "Found ${matched.size} matches for \"$command\""
                          var speechText = "Found ${matched.size} contacts. "
                          displayList.clear()
                          matched.forEachIndexed { idx, contact ->
                              speechText += "Number ${idx + 1}: ${contact.name}. "
                              displayList.add("🔸 ${idx + 1}. ${contact.name} (${contact.phone})")
                          }
                          speakOut(speechText)
                      }
                  }
              }

              private fun speakOut(text: String) {
                  textToSpeech.speak(text, TextToSpeech.QUEUE_FLUSH, null, "")
              }

              private fun makePhoneCall(phoneNumber: String) {
                  val intent = Intent(Intent.ACTION_CALL).apply {
                      data = Uri.parse("tel:$phoneNumber")
                  }
                  if (ActivityCompat.checkSelfPermission(this, Manifest.permission.CALL_PHONE) == PackageManager.PERMISSION_GRANTED) {
                      startActivity(intent)
                  }
              }

              override fun onInit(status: Int) {
                  if (status == TextToSpeech.SUCCESS) {
                      textToSpeech.language = Locale("hi", "IN")
                  }
              }

              override fun onDestroy() {
                  if (::speechRecognizer.isInitialized) speechRecognizer.destroy()
                  if (::textToSpeech.isInitialized) {
                      textToSpeech.stop()
                      textToSpeech.shutdown()
                  }
                  super.onDestroy()
              }
          }

          class ViewPagerAdapter(activity: AppCompatActivity) : androidx.viewpager2.adapter.FragmentStateAdapter(activity) {
              override fun getItemCount(): Int = 2
              override fun createFragment(position: Int): androidx.fragment.app.Fragment {
                  return if (position == 0) AssistantFragment() else ContactsFragment()
              }
          }

          class AssistantFragment : androidx.fragment.app.Fragment() {
              override fun onCreateView(inflater: android.view.LayoutInflater, container: ViewGroup?, savedInstanceState: Bundle?): View {
                  val layout = LinearLayout(requireContext()).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setPadding(24, 24, 24, 24)
                      setBackgroundColor(Color.parseColor("#011F18"))
                  }

                  // 📊 Equalizer Audio Wave Lines matching screenshot exactly
                  val waveTv = TextView(requireContext()).apply {
                      text = " ıllılıl llılıll "
                      textSize = 26f
                      setTextColor(Color.parseColor("#34D399"))
                      gravity = Gravity.CENTER
                      setPadding(0, 0, 0, 10)
                  }

                  val statusTitleTv = TextView(requireContext()).apply {
                      text = "Listening..."
                      textSize = 16f
                      setTextColor(Color.parseColor("#A7F3D0"))
                      gravity = Gravity.CENTER
                      setPadding(0, 0, 0, 20)
                  }

                  // 🎤 Large 3D Neon Mic Button in Center
                  val btnMic = ImageButton(requireContext()).apply {
                      layoutParams = LinearLayout.LayoutParams(160, 160).apply { setMargins(0, 0, 0, 25) }
                      setBackgroundResource(R.drawable.circle_mic_normal)
                      setImageResource(android.R.drawable.ic_btn_speak_now)
                      scaleType = ImageView.ScaleType.CENTER_INSIDE
                      elevation = 20f
                      contentDescription = "3D Z Assistant Mic"
                  }

                  // 🧊 3D Glassmorphism Status Card matching screenshot
                  val cardLayout = LinearLayout(requireContext()).apply {
                      orientation = LinearLayout.HORIZONTAL
                      layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT).apply { setMargins(0, 5, 0, 20) }
                      background = ContextCompat.getDrawable(requireContext(), R.drawable.card_background)
                      setPadding(20, 16, 20, 16)
                      gravity = Gravity.CENTER_VERTICAL
                      elevation = 12f
                  }

                  // Green Indicator Dot
                  val dotView = View(requireContext()).apply {
                      layoutParams = LinearLayout.LayoutParams(16, 16).apply { setMargins(0, 0, 14, 0) }
                      background = ContextCompat.getDrawable(requireContext(), android.R.drawable.presence_online)
                  }

                  val statusTv = TextView(requireContext()).apply {
                      text = "Your AI Call Assistant\n${MainActivity.instance.assistantStatusText}"
                      textSize = 14f
                      setTextColor(Color.parseColor("#FFFFFF"))
                  }
                  cardLayout.addView(dotView)
                  cardLayout.addView(statusTv)

                  val listView = ListView(requireContext()).apply {
                      layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f)
                      background = ContextCompat.getDrawable(requireContext(), R.drawable.list_background)
                  }

                  val adapter = ArrayAdapter(requireContext(), android.R.layout.simple_list_item_1, MainActivity.instance.displayList)
                  listView.adapter = adapter

                  btnMic.setOnClickListener {
                      btnMic.setBackgroundResource(R.drawable.circle_mic_active)
                      statusTitleTv.text = "Listening..."
                      statusTv.text = "Your AI Call Assistant\nListening in Hindi, Urdu & English..."
                      MainActivity.instance.startVoiceListening()
                      
                      btnMic.postDelayed({
                          btnMic.setBackgroundResource(R.drawable.circle_mic_normal)
                          statusTitleTv.text = "Listening..."
                          statusTv.text = "Your AI Call Assistant\n${MainActivity.instance.assistantStatusText}"
                      }, 5000)
                  }

                  layout.addView(waveTv)
                  layout.addView(statusTitleTv)
                  layout.addView(btnMic)
                  layout.addView(cardLayout)
                  layout.addView(listView)
                  return layout
              }
          }

          class ContactsFragment : androidx.fragment.app.Fragment() {
              override fun onCreateView(inflater: android.view.LayoutInflater, container: ViewGroup?, savedInstanceState: Bundle?): View {
                  val layout = LinearLayout(requireContext()).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(20, 20, 20, 20)
                      setBackgroundColor(Color.parseColor("#011F18"))
                  }

                  val title = TextView(requireContext()).apply {
                      text = "📂 All Synced Contacts & 3D History"
                      textSize = 18f
                      setTextColor(Color.parseColor("#34D399"))
                      setPadding(0, 0, 0, 15)
                  }

                  val listView = ListView(requireContext()).apply {
                      layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT)
                      background = ContextCompat.getDrawable(requireContext(), R.drawable.list_background)
                  }

                  val adapter = ArrayAdapter(requireContext(), android.R.layout.simple_list_item_1, MainActivity.instance.fullContactsList)
                  listView.adapter = adapter

                  layout.addView(title)
                  layout.addView(listView)
                  return layout
              }
          }
