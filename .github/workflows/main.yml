        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Z-Plus-2-Assistant-Call-APK
          path: app/build/outputs/apk/debug/app-debug.apk
