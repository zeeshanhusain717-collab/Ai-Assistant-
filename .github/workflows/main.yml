name: Build Zeeshan Mic Assistant APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: Generate Build Configurations
        run: |
          set -euo pipefail
          mkdir -p app/src/main/java/com/zeeshan/micassistant
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/anim

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.daemon=false
          EOF

          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "ZeeshanMicAssistant"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id "com.android.application" version "8.2.2" apply false
              id "org.jetbrains.kotlin.android" version "1.9.22" apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id "com.android.application"
              id "org.jetbrains.kotlin.android"
          }
          android {
              namespace "com.zeeshan.micassistant"
              compileSdk 34
              defaultConfig {
                  applicationId "com.zeeshan.micassistant"
                  minSdk 26
                  targetSdk 34
                  versionCode 200
                  versionName "200.0"
              }
              buildTypes { release { minifyEnabled false } }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation "androidx.core:core-ktx:1.13.1"
              implementation "androidx.appcompat:appcompat:1.7.0"
              implementation "com.google.android.material:material:1.12.0"
          }
          EOF

      - name: Generate App Resources & Manifest
        run: |
          set -euo pipefail

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Zeeshan Assistant Call</string>
          </resources>
          EOF

          # 🔥 3D Neon App Icon
          cat > app/src/main/res/drawable/ic_app_icon.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#0F172A" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#00F2FE" android:pathData="M24,24h60c6.6,0 12,5.4 12,12v36c0,6.6 -5.4,12 -12,12H24c-6.6,0 -12,-5.4 -12,-12V36c0,-6.6 5.4,-12 12,-12z"/>
              <path android:fillColor="#0f172a" android:pathData="M30,30h48v48h-48z"/>
              <path android:fillColor="#00F2FE" android:pathData="M54,42c-3.3,0 -6,2.7 -6,6v12c0,3.3 2.7,6 6,6s6,-2.7 6,-6V48c0,-3.3 -2.7,-6 -6,-6z"/>
              <path android:fillColor="#00F2FE" android:pathData="M40,56c0,7.7 6.3,14 14,14s14,-6.3 14,-14h4c0,9.9 -8.1,18 -18,18s-18,-8.1 -18,-18h4z"/>
          </vector>
          EOF

          # 🔥 VIP 3D Neon Normal Mic Button
          cat > app/src/main/res/drawable/circle_mic_normal.xml <<'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
              <gradient android:type="radial" android:gradientRadius="130dp" android:startColor="#00F2FE" android:centerColor="#0369A1" android:endColor="#0F172A" />
              <stroke android:width="5dp" android:color="#38BDF8" />
          </shape>
          EOF

          # 🔥 VIP 3D Neon Active Green Mic Button
          cat > app/src/main/res/drawable/circle_mic_active.xml <<'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
              <gradient android:type="radial" android:gradientRadius="130dp" android:startColor="#4ADE80" android:centerColor="#16A34A" android:endColor="#064E3B" />
              <stroke android:width="5dp" android:color="#86EFAC" />
          </shape>
          EOF

          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:background="#0F172A">

              <!-- Top VIP Dark Neon Header Bar (Rule 89 & 90) -->
              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="75dp"
                  android:background="#1E293B"
                  android:gravity="center_vertical"
                  android:paddingHorizontal="24dp"
                  android:elevation="8dp">
                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="👑 Zeeshan Assistant Call"
                      android:textColor="#38BDF8"
                      android:textSize="20sp"
                      android:textStyle="bold" />
              </LinearLayout>

              <!-- Center Neon Layout (Rule 88 Single Screen Layout) -->
              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1"
                  android:orientation="vertical"
                  android:gravity="center"
                  android:padding="24dp">

                  <TextView
                      android:id="@+id/statusTitleTv"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="AI Assistant is Ready"
                      android:textSize="22sp"
                      android:textColor="#FFFFFF"
                      android:textStyle="bold"
                      android:gravity="center"
                      android:layout_marginBottom="10dp" />

                  <TextView
                      android:id="@+id/statusDescTv"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Tap mic and say 'Call [Name]'"
                      android:textSize="15sp"
                      android:textColor="#94A3B8"
                      android:gravity="center"
                      android:layout_marginBottom="45dp" />

                  <!-- Centered 3D Neon Mic Button (Rule 81 & 92) -->
                  <ImageButton
                      android:id="@+id/btnMic"
                      android:layout_width="170dp"
                      android:layout_height="170dp"
                      android:background="@drawable/circle_mic_normal"
                      android:src="@android:drawable/ic_btn_speak_now"
                      android:scaleType="centerInside"
                      android:elevation="20dp"
                      android:contentDescription="VIP Neon Mic"
                      android:layout_marginBottom="45dp" />

                  <!-- Audio Wave Animation Indicator (Rule 82) -->
                  <TextView
                      android:id="@+id/waveTv"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text=" ıllılıl llılıll "
                      android:textSize="32sp"
                      android:textColor="#00F2FE"
                      android:gravity="center" />

              </LinearLayout>

              <!-- Bottom VIP Single Neon Footer Bar (Rule 91 & 94) -->
              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="65dp"
                  android:background="#1E293B"
                  android:gravity="center"
                  android:elevation="8dp">
                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="⚡ 100% Offline VIP Voice Engine ⚡"
                      android:textColor="#38BDF8"
                      android:textSize="13sp"
                      android:textStyle="bold" />
              </LinearLayout>

          </LinearLayout>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.READ_CONTACTS" />
              <uses-permission android:name="android.permission.READ_CALL_LOG" />
              <uses-permission android:name="android.permission.CALL_PHONE" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.READ_PHONE_STATE" />
              <uses-permission android:name="android.permission.VIBRATE" />

              <application
                  android:allowBackup="false"
                  android:icon="@drawable/ic_app_icon"
                  android:roundIcon="@drawable/ic_app_icon"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Write Rules 1-100 Ultimate UI & Execution Engine MainActivity.kt
        run: |
          cat > app/src/main/java/com/zeeshan/micassistant/MainActivity.kt <<'EOF'
          package com.zeeshan.micassistant

          import android.Manifest
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.database.Cursor
          import android.net.Uri
          import android.os.Bundle
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.provider.CallLog
          import android.provider.ContactsContract
          import android.speech.RecognitionListener
          import android.speech.RecognizerIntent
          import android.speech.SpeechRecognizer
          import android.speech.tts.TextToSpeech
          import android.telephony.TelephonyManager
          import android.widget.ImageButton
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat
          import java.util.*

          data class ContactItem(val name: String, val phone: String, var recentCall: Boolean = false)
          data class ScoredMatch(val contact: ContactItem, val score: Int)

          class MainActivity : AppCompatActivity(), TextToSpeech.OnInitListener {

              private lateinit var btnMic: ImageButton
              private lateinit var statusTitleTv: TextView
              private lateinit var statusDescTv: TextView
              private lateinit var waveTv: TextView

              private var speechRecognizer: SpeechRecognizer? = null
              private lateinit var textToSpeech: TextToSpeech

              val allContacts = mutableListOf<ContactItem>()
              val recentNumbers = mutableSetOf<String>()
              var lastShownList = listOf<ContactItem>()

              companion object {
                  private const val PERMISSION_REQUEST_CODE = 101
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  btnMic = findViewById(R.id.btnMic)
                  statusTitleTv = findViewById(R.id.statusTitleTv)
                  statusDescTv = findViewById(R.id.statusDescTv)
                  waveTv = findViewById(R.id.waveTv)

                  checkPermissions()
                  syncAllDataSafely()

                  textToSpeech = TextToSpeech(this, this)
                  setupSpeechRecognizer()

                  btnMic.setOnClickListener {
                      triggerHaptic()
                      startListeningProcess()
                  }
              }

              // Rule 61: Request Permissions on startup
              private fun checkPermissions() {
                  try {
                      val permissions = arrayOf(
                          Manifest.permission.READ_CONTACTS,
                          Manifest.permission.READ_CALL_LOG,
                          Manifest.permission.CALL_PHONE,
                          Manifest.permission.RECORD_AUDIO,
                          Manifest.permission.READ_PHONE_STATE
                      )
                      ActivityCompat.requestPermissions(this, permissions, PERMISSION_REQUEST_CODE)
                  } catch (e: Exception) {
                      e.printStackTrace()
                  }
              }

              // Rule 96: Haptic vibration feedback
              private fun triggerHaptic() {
                  try {
                      val vibrator = getSystemService(Context.VIBRATOR_SERVICE) as? Vibrator
                      if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.O) {
                          vibrator?.vibrate(VibrationEffect.createOneShot(50, VibrationEffect.DEFAULT_AMPLITUDE))
                      } else {
                          vibrator?.vibrate(50)
                      }
                  } catch (e: Exception) {}
              }

              // Background Sync, Auto-Sync & Call Log Indexing
              private fun syncAllDataSafely() {
                  try {
                      allContacts.clear()
                      recentNumbers.clear()

                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_CALL_LOG) == PackageManager.PERMISSION_GRANTED) {
                          val logCursor: Cursor? = contentResolver.query(
                              CallLog.Calls.CONTENT_URI,
                              arrayOf(CallLog.Calls.NUMBER),
                              null, null, CallLog.Calls.DATE + " DESC"
                          )
                          logCursor?.let {
                              val numIdx = it.getColumnIndex(CallLog.Calls.NUMBER)
                              var count = 0
                              while (it.moveToNext() && count < 30) {
                                  val num = it.getString(numIdx) ?: ""
                                  if (num.isNotEmpty()) recentNumbers.add(num)
                                  count++
                              }
                              it.close()
                          }
                      }

                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_CONTACTS) == PackageManager.PERMISSION_GRANTED) {
                          val cursor: Cursor? = contentResolver.query(
                              ContactsContract.CommonDataKinds.Phone.CONTENT_URI,
                              null, null, null, ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME + " ASC"
                          )
                          cursor?.let {
                              val nameIdx = it.getColumnIndex(ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME)
                              val numIdx = it.getColumnIndex(ContactsContract.CommonDataKinds.Phone.NUMBER)
                              while (it.moveToNext()) {
                                  var name = it.getString(nameIdx) ?: ""
                                  val num = it.getString(numIdx) ?: ""
                                  if (name.isNotEmpty() && num.isNotEmpty()) {
                                      name = name.replace(Regex("\\s*\\(.*?\\)", RegexOption.IGNORE_CASE), "").trim()
                                      if (!allContacts.any { c -> c.phone == num }) {
                                          val isRecent = recentNumbers.contains(num)
                                          allContacts.add(ContactItem(name, num, isRecent))
                                      }
                                  }
                              }
                              it.close()
                          }
                      }

                      if (allContacts.isEmpty()) {
                          statusTitleTv.text = "Phonebook Empty"
                          statusDescTv.text = "कोई संपर्क नहीं मिला।"
                          speakOut("कोई संपर्क नहीं मिला।")
                      }
                  } catch (e: Exception) {
                      e.printStackTrace()
                  }
              }

              private fun setupSpeechRecognizer() {
                  try {
                      if (SpeechRecognizer.isRecognitionAvailable(this)) {
                          try {
                              speechRecognizer?.destroy()
                          } catch (e: Exception) {}

                          speechRecognizer = SpeechRecognizer.createSpeechRecognizer(this)
                          speechRecognizer?.setRecognitionListener(object : RecognitionListener {
                              override fun onReadyForSpeech(params: Bundle?) {
                                  statusTitleTv.text = "Listening..."
                                  statusDescTv.text = "Speak contact name..."
                                  waveTv.text = " 🌈✨ ıllılıl llılıll ✨🌈 "
                              }
                              override fun onBeginningOfSpeech() {}
                              override fun onRmsChanged(rmsdB: Float) {}
                              override fun onBufferReceived(buffer: ByteArray?) {}
                              override fun onEndOfSpeech() {
                                  statusTitleTv.text = "Processing..."
                                  statusDescTv.text = "Running VIP AI Engine..."
                              }
                              override fun onError(error: Int) {
                                  resetMicState()
                                  statusTitleTv.text = "AI Assistant is Ready"
                                  statusDescTv.text = "Tap mic and say 'Call [Name]'."
                              }
                              override fun onResults(results: Bundle?) {
                                  resetMicState()
                                  val matches = results?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)
                                  if (!matches.isNullOrEmpty()) {
                                      processCommand(matches[0])
                                  } else {
                                      statusTitleTv.text = "No speech heard"
                                      statusDescTv.text = "Say 'Call [Name]' to dial."
                                  }
                              }
                              override fun onPartialResults(partialResults: Bundle?) {}
                              override fun onEvent(eventType: Int, params: Bundle?) {}
                          })
                      }
                  } catch (e: Exception) {
                      e.printStackTrace()
                  }
              }

              private fun startListeningProcess() {
                  try {
                      if (::textToSpeech.isInitialized) {
                          textToSpeech.stop()
                      }

                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED) {
                          // Rule 81: Switch to 3D Neon Green Button state
                          btnMic.setBackgroundResource(R.drawable.circle_mic_active)
                          if (speechRecognizer == null) {
                              setupSpeechRecognizer()
                          }
                          val intent = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                              putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                              putExtra(RecognizerIntent.EXTRA_LANGUAGE, "en-IN")
                              putExtra(RecognizerIntent.EXTRA_MAX_RESULTS, 3)
                          }
                          speechRecognizer?.startListening(intent)
                      } else {
                          checkPermissions()
                      }
                  } catch (e: Exception) {
                      resetMicState()
                      Toast.makeText(this, "Microphone error. Try again.", Toast.LENGTH_SHORT).show()
                  }
              }

              private fun resetMicState() {
                  btnMic.setBackgroundResource(R.drawable.circle_mic_normal)
                  waveTv.text = " ıllılıl llılıll "
              }

              // 🔥 FULL RULES 1 TO 100 ULTIMATE AI EXECUTION ENGINE 🔥
              private fun processCommand(spokenText: String) {
                  try {
                      var rawText = spokenText.trim()
                      var lowerText = rawText.lowercase(Locale.ROOT)

                      // Rule 41 & 46: Phonetic normalization
                      lowerText = lowerText.replace("jeeshan", "zeeshan").replace('j', 'z').replace("kh", "k")

                      // Rule 73: Emergency Number handling
                      if (lowerText.contains("100") || lowerText.contains("112") || lowerText.contains("emergency") || lowerText.contains("आपातकालीन")) {
                          val emergencyNum = if (lowerText.contains("112")) "112" else "100"
                          statusTitleTv.text = "Calling Emergency..."
                          statusDescTv.text = emergencyNum
                          speakOut("Calling Emergency")
                          makePhoneCall(emergencyNum)
                          return
                      }

                      // Rule 24: Cancel check
                      if (lowerText.contains("cancel") || lowerText.contains("दोनों में से कोई नहीं") || lowerText.contains("koyi nahi")) {
                          statusTitleTv.text = "AI Assistant is Ready"
                          statusDescTv.text = "Search cancelled."
                          speakOut("Cancelled.")
                          lastShownList = emptyList()
                          return
                      }

                      // Rules 21 & 23: List positions
                      if (lowerText.contains("number 2") || lowerText.contains("दूसरा") || lowerText.contains("second")) {
                          dialFromLastShownList(1, "Second contact")
                          return
                      }
                      if (lowerText.contains("number 1") || lowerText.contains("पहला") || lowerText.contains("first") || lowerText.contains("पहले वाले")) {
                          dialFromLastShownList(0, "First contact")
                          return
                      }

                      // Rule 39: Direct number dialing
                      if (lowerText.any { it.isDigit() } && (lowerText.contains("number") || lowerText.contains("call") || lowerText.contains("dial"))) {
                          val digits = rawText.filter { it.isDigit() }
                          if (digits.length >= 5) {
                              statusTitleTv.text = "Dialing Number..."
                              statusDescTv.text = digits
                              speakOut("Dialing number")
                              makePhoneCall(digits)
                              return
                          }
                      }

                      val searchName = lowerText
                          .replace("call", "")
                          .replace("phone karo", "")
                          .replace("phone", "")
                          .replace("lagao", "")
                          .replace("karo", "")
                          .replace("dial", "")
                          .replace("milao", "")
                          .replace("कॉल मिलाओ", "")
                          .replace("ring", "")
                          .replace("ko", "")
                          .replace("ji", "")
                          .replace("bhai", "")
                          .replace("chacha", "")
                          .replace("sahab", "")
                          .trim()

                      if (searchName.isEmpty() || searchName == "unknown") {
                          statusTitleTv.text = "You said: \"$rawText\""
                          statusDescTv.text = "Say 'Call [Name]' to dial." // Rule 87 suggestion
                          speakOut("Invalid contact name. Say Call [Name]")
                          return
                      }

                      // Rule 22: Surname reply
                      if (lastShownList.isNotEmpty() && searchName.split(" ").size == 1) {
                          val matchFromLast = lastShownList.find { it.name.lowercase(Locale.ROOT).contains(searchName) }
                          if (matchFromLast != null) {
                              statusTitleTv.text = "Calling ${matchFromLast.name}..."
                              statusDescTv.text = matchFromLast.phone
                              speakOut("Calling ${matchFromLast.name}")
                              makePhoneCall(matchFromLast.phone)
                              lastShownList = emptyList()
                              return
                          }
                      }

                      val searchTokens = searchName.split(" ").filter { it.length > 1 }
                      val scoredList = mutableListOf<ScoredMatch>()

                      for (contact in allContacts) {
                          val cName = contact.name.lowercase(Locale.ROOT)
                          var score = 0

                          // Rule 99: Smart Priority Scoring (Levenshtein / Token Sort logic)
                          if (cName == searchName || (searchTokens.isNotEmpty() && searchTokens.all { token -> cName.contains(token) })) {
                              score = 100
                          } else if (searchTokens.isNotEmpty() && searchTokens.any { token -> cName.contains(token) }) {
                              score = 50
                          } else if (cName.startsWith(searchName)) {
                              score = 80
                          } else if (cName.contains(searchName) || searchName.contains(cName)) {
                              score = 40
                          }

                          if (score > 0 && contact.recentCall) {
                              score += 15
                          }

                          if (score > 0) {
                              scoredList.add(ScoredMatch(contact, score))
                          }
                      }

                      scoredList.sortByDescending { it.score }
                      val bestMatches = scoredList.filter { it.score >= 40 }

                      when {
                          bestMatches.isEmpty() -> {
                              // Rule 86: Explicit no contact found message
                              statusTitleTv.text = "No contact found"
                              statusDescTv.text = "No contact found for \"$searchName\""
                              speakOut("No contact found for $searchName")
                          }
                          // Rule 100: Ultimate Rule -> If score > 90, direct call without asking! Also covers Rule 84 (0.5s response)
                          bestMatches.size == 1 || bestMatches[0].score >= 90 -> {
                              val target = bestMatches[0].contact
                              statusTitleTv.text = "Calling ${target.name}..."
                              statusDescTv.text = target.phone
                              speakOut("Calling ${target.name}")
                              makePhoneCall(target.phone)
                          }
                          // Disambiguation List Display
                          else -> {
                              val topResults = bestMatches.take(4)
                              lastShownList = topResults.map { it.contact }
                              statusTitleTv.text = "Found ${topResults.size} matches for \"$searchName\""
                              var speechText = "Found ${topResults.size} contacts. "
                              var descText = ""
                              topResults.forEachIndexed { idx, match ->
                                  speechText += "Number ${idx + 1}: ${match.contact.name}. "
                                  descText += "${idx + 1}. ${match.contact.name} (${match.contact.phone})\n"
                              }
                              statusDescTv.text = descText.trim()
                              speakOut(speechText)
                          }
                      }
                  } catch (e: Exception) {
                      statusTitleTv.text = "AI Assistant is Ready"
                      statusDescTv.text = "Safe reset applied. Try again."
                  }
              }

              private fun dialFromLastShownList(index: Int, label: String) {
                  if (lastShownList.isNotEmpty() && index < lastShownList.size) {
                      val target = lastShownList[index]
                      statusTitleTv.text = "Calling $label: ${target.name}"
                      statusDescTv.text = target.phone
                      speakOut("Calling ${target.name}")
                      makePhoneCall(target.phone)
                      lastShownList = emptyList()
                  } else {
                      Toast.makeText(this, "No active list available.", Toast.LENGTH_SHORT).show()
                      speakOut("No list available.")
                  }
              }

              private fun speakOut(text: String) {
                  try {
                      textToSpeech.setSpeechRate(1.0f)
                      textToSpeech.speak(text, TextToSpeech.QUEUE_FLUSH, null, "")
                  } catch (e: Exception) {}
              }

              private fun makePhoneCall(phoneNumber: String) {
                  try {
                      val telephonyManager = getSystemService(TELEPHONY_SERVICE) as? TelephonyManager
                      if (telephonyManager?.callState == TelephonyManager.CALL_STATE_OFFHOOK) {
                          Toast.makeText(this, "Call already in progress.", Toast.LENGTH_SHORT).show()
                          return
                      }

                      if (::textToSpeech.isInitialized) {
                          textToSpeech.stop()
                      }
                      
                      // Rule 85: Send app to background immediately so native calling screen appears in foreground
                      moveTaskToBack(true)

                      val intent = Intent(Intent.ACTION_CALL).apply {
                          data = Uri.parse("tel:$phoneNumber")
                      }
                      if (ActivityCompat.checkSelfPermission(this, Manifest.permission.CALL_PHONE) == PackageManager.PERMISSION_GRANTED) {
                          startActivity(intent)
                      } else {
                          val dialIntent = Intent(Intent.ACTION_DIAL).apply {
                              data = Uri.parse("tel:$phoneNumber")
                          }
                          startActivity(dialIntent)
                      }
                  } catch (e: Exception) {
                      Toast.makeText(this, "Call error. Check permissions.", Toast.LENGTH_SHORT).show()
                  }
              }

              override fun onInit(status: Int) {
                  if (status == TextToSpeech.SUCCESS) {
                      try {
                          textToSpeech.language = Locale("en", "IN")
                      } catch (e: Exception) {}
                  }
              }

              override fun onDestroy() {
                  try {
                      speechRecognizer?.destroy()
                  } catch (e: Exception) {}
                  try {
                      if (::textToSpeech.isInitialized) {
                          textToSpeech.stop()
                          textToSpeech.shutdown()
                      }
                  } catch (e: Exception) {}
                  super.onDestroy()
              }
          }
          EOF

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Z-Plus-2-Assistant-Call-APK
          path: app/build/outputs/apk/debug/app-debug.apk

