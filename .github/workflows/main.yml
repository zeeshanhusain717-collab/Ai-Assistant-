name: Build Zeeshan Mic Assistant APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: Generate Build Configurations
        run: |
          set -euo pipefail
          mkdir -p app/src/main/java/com/zeeshan/micassistant
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/anim

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.daemon=false
          EOF

          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "ZeeshanMicAssistant"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id "com.android.application" version "8.2.2" apply false
              id "org.jetbrains.kotlin.android" version "1.9.22" apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id "com.android.application"
              id "org.jetbrains.kotlin.android"
          }
          android {
              namespace "com.zeeshan.micassistant"
              compileSdk 34
              defaultConfig {
                  applicationId "com.zeeshan.micassistant"
                  minSdk 26
                  targetSdk 34
                  versionCode 1006
                  versionName "1006.0"
              }
              buildTypes { release { minifyEnabled false } }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation "androidx.core:core-ktx:1.13.1"
              implementation "androidx.appcompat:appcompat:1.7.0"
              implementation "com.google.android.material:material:1.12.0"
          }
          EOF

      - name: Generate App Resources & Manifest
        run: |
          set -euo pipefail

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Z + 2 Assistant Call</string>
          </resources>
          EOF

          # 🔥 3D Neon App Icon
          cat > app/src/main/res/drawable/ic_app_icon.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#0B1315" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#00F2FE" android:pathData="M24,24h60c6.6,0 12,5.4 12,12v36c0,6.6 -5.4,12 -12,12H24c-6.6,0 -12,-5.4 -12,-12V36c0,-6.6 5.4,-12 12,-12z"/>
              <path android:fillColor="#0b1315" android:pathData="M30,30h48v48h-48z"/>
              <path android:fillColor="#00F2FE" android:pathData="M54,42c-3.3,0 -6,2.7 -6,6v12c0,3.3 2.7,6 6,6s6,-2.7 6,-6V48c0,-3.3 -2.7,-6 -6,-6z"/>
              <path android:fillColor="#00F2FE" android:pathData="M40,56c0,7.7 6.3,14 14,14s14,-6.3 14,-14h4c0,9.9 -8.1,18 -18,18s-18,-8.1 -18,-18h4z"/>
          </vector>
          EOF

          # 🔥 VIP 3D Neon Normal Mic Button
          cat > app/src/main/res/drawable/circle_mic_normal.xml <<'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
              <gradient android:type="radial" android:gradientRadius="140dp" android:startColor="#00F2FE" android:centerColor="#0369A1" android:endColor="#0B1315" />
              <stroke android:width="6dp" android:color="#38BDF8" />
          </shape>
          EOF

          # 🔥 VIP 3D Neon Active Green Mic Button
          cat > app/src/main/res/drawable/circle_mic_active.xml <<'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
              <gradient android:type="radial" android:gradientRadius="140dp" android:startColor="#4ADE80" android:centerColor="#16A34A" android:endColor="#064E3B" />
              <stroke android:width="6dp" android:color="#86EFAC" />
          </shape>
          EOF

          # 🔥 Glassmorphism Card Background
          cat > app/src/main/res/drawable/glass_card_bg.xml <<'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#B3111E26" />
              <corners android:radius="24dp" />
              <stroke android:width="1dp" android:color="#3338BDF8" />
          </shape>
          EOF

          # 🔥 Exact Image Matching activity_main.xml Layout 🔥
          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:background="#0B1315"
              android:padding="20dp">

              <!-- Top Branding Header (Matching Image Top Bar) -->
              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="horizontal"
                  android:gravity="center_vertical"
                  android:layout_marginTop="10dp"
                  android:layout_marginBottom="20dp">

                  <!-- App Icon Thumbnail -->
                  <ImageView
                      android:layout_width="48dp"
                      android:layout_height="48dp"
                      android:src="@drawable/ic_app_icon"
                      android:background="@drawable/glass_card_bg"
                      android:padding="6ssp"
                      android:contentDescription="Logo" />

                  <TextView
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:text="Z + 2 Assistant\nCall"
                      android:textColor="#FFFFFF"
                      android:textSize="20sp"
                      android:textStyle="bold"
                      android:layout_marginStart="16dp" />

              </LinearLayout>

              <!-- Center Voice Interaction Area -->
              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1"
                  android:orientation="vertical"
                  android:gravity="center">

                  <TextView
                      android:id="@+id/statusTitleTv"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Listening..."
                      android:textSize="22sp"
                      android:textColor="#FFFFFF"
                      android:textStyle="bold"
                      android:layout_marginBottom="12dp" />

                  <!-- Audio Wave Visualization Bars -->
                  <TextView
                      android:id="@+id/waveTv"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text=" ıllılıl llılıll "
                      android:textSize="32sp"
                      android:textColor="#00F2FE"
                      android:layout_marginBottom="40dp" />

                  <!-- Centered 3D Neon Mic Button (Exact Image Match) -->
                  <ImageButton
                      android:id="@+id/btnMic"
                      android:layout_width="180dp"
                      android:layout_height="180dp"
                      android:background="@drawable/circle_mic_normal"
                      android:src="@android:drawable/ic_btn_speak_now"
                      android:scaleType="centerInside"
                      android:elevation="24dp"
                      android:contentDescription="3D Neon Mic"
                      android:layout_marginBottom="40dp" />

                  <!-- Glassmorphism Status Card (Matching Image Card) -->
                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:background="@drawable/glass_card_bg"
                      android:orientation="horizontal"
                      android:gravity="center_vertical"
                      android:padding="16dp">

                      <!-- Glowing Green Dot -->
                      <View
                          android:layout_width="14dp"
                          android:layout_height="14dp"
                          android:background="@drawable/circle_mic_active"
                          android:layout_marginEnd="16dp" />

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:orientation="vertical">

                          <TextView
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:text="Your AI Call Assistant"
                              android:textColor="#FFFFFF"
                              android:textSize="15sp"
                              android:textStyle="bold" />

                          <TextView
                              android:id="@+id/statusDescTv"
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:text="Listening..."
                              android:textColor="#94A3B8"
                              android:textSize="13sp" />

                      </LinearLayout>
                  </LinearLayout>

              </LinearLayout>

              <!-- Bottom Dual Navigation Bar (Matching Image Bottom Tabs) -->
              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="75dp"
                  android:orientation="horizontal"
                  android:layout_marginTop="10dp"
                  android:weightSum="2">

                  <!-- Z Assistant Tab (Active) -->
                  <LinearLayout
                      android:layout_width="0dp"
                      android:layout_height="match_parent"
                      android:layout_weight="1"
                      android:background="@drawable/glass_card_bg"
                      android:orientation="vertical"
                      android:gravity="center"
                      android:layout_marginEnd="8dp">

                      <LinearLayout
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:orientation="horizontal"
                          android:gravity="center_vertical">
                          <ImageView
                              android:layout_width="20dp"
                              android:layout_height="20dp"
                              android:src="@android:drawable/stat_sys_phone_call"
                              android:tint="#4ADE80"
                              android:contentDescription="Call" />
                          <TextView
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:text="Z ASSISTANT"
                              android:textColor="#4ADE80"
                              android:textSize="13sp"
                              android:textStyle="bold"
                              android:layout_marginStart="8dp" />
                      </LinearLayout>

                      <!-- Green Active Underline Indicator -->
                      <View
                          android:layout_width="40dp"
                          android:layout_height="3dp"
                          android:background="#4ADE80"
                          android:layout_marginTop="6dp" />

                  </LinearLayout>

                  <!-- Contacts / Directory Tab -->
                  <LinearLayout
                      android:id="@+id/btnOpenDirectoryCard"
                      android:layout_width="0dp"
                      android:layout_height="match_parent"
                      android:layout_weight="1"
                      android:background="@drawable/glass_card_bg"
                      android:orientation="horizontal"
                      android:gravity="center"
                      android:layout_marginStart="8dp"
                      android:clickable="true"
                      android:focusable="true">

                      <ImageView
                          android:layout_width="22dp"
                          android:layout_height="22dp"
                          android:src="@android:drawable/ic_menu_my_calendar"
                          android:tint="#94A3B8"
                          android:contentDescription="Contacts" />
                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="CONTACTS"
                          android:textColor="#94A3B8"
                          android:textSize="13sp"
                          android:textStyle="bold"
                          android:layout_marginStart="8dp" />

                  </LinearLayout>

              </LinearLayout>

          </LinearLayout>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.READ_CONTACTS" />
              <uses-permission android:name="android.permission.READ_CALL_LOG" />
              <uses-permission android:name="android.permission.CALL_PHONE" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.READ_PHONE_STATE" />
              <uses-permission android:name="android.permission.VIBRATE" />

              <application
                  android:allowBackup="false"
                  android:icon="@drawable/ic_app_icon"
                  android:roundIcon="@drawable/ic_app_icon"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Write Complete Pixel-Perfect MainActivity.kt
        run: |
          cat > app/src/main/java/com/zeeshan/micassistant/MainActivity.kt <<'EOF'
          package com.zeeshan.micassistant

          import android.Manifest
          import android.app.AlertDialog
          import android.content.Context
          import android.content.Intent
          import android.content.SharedPreferences
          import android.content.pm.PackageManager
          import android.database.Cursor
          import android.graphics.Color
          import android.net.Uri
          import android.os.Bundle
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.provider.ContactsContract
          import android.speech.RecognitionListener
          import android.speech.RecognizerIntent
          import android.speech.SpeechRecognizer
          import android.speech.tts.TextToSpeech
          import android.view.Gravity
          import android.view.View
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat
          import java.util.*

          data class ContactItem(val name: String, val phone: String, var mappedAlias: String = "", var isShown: Boolean = false)

          class MainActivity : AppCompatActivity(), TextToSpeech.OnInitListener {

              private lateinit var btnMic: ImageButton
              private lateinit var btnOpenDirectoryCard: LinearLayout
              private lateinit var statusTitleTv: TextView
              private lateinit var statusDescTv: TextView
              private lateinit var waveTv: TextView

              private var speechRecognizer: SpeechRecognizer? = null
              private lateinit var textToSpeech: TextToSpeech
              private lateinit var sharedPrefs: SharedPreferences

              val allContacts = mutableListOf<ContactItem>()

              companion object {
                  private const val PERMISSION_REQUEST_CODE = 101
                  private const val PREFS_NAME = "ZeeshanMappingPrefs"
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  sharedPrefs = getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)

                  btnMic = findViewById(R.id.btnMic)
                  btnOpenDirectoryCard = findViewById(R.id.btnOpenDirectoryCard)
                  statusTitleTv = findViewById(R.id.statusTitleTv)
                  statusDescTv = findViewById(R.id.statusDescTv)
                  waveTv = findViewById(R.id.waveTv)

                  checkPermissions()
                  syncContactsWithMappings()

                  textToSpeech = TextToSpeech(this, this)
                  setupSpeechRecognizer()

                  btnMic.setOnClickListener {
                      triggerHaptic()
                      startListeningProcess()
                  }

                  btnOpenDirectoryCard.setOnClickListener {
                      triggerHaptic()
                      showDirectoryScreen()
                  }
              }

              private fun checkPermissions() {
                  try {
                      val permissions = arrayOf(
                          Manifest.permission.READ_CONTACTS,
                          Manifest.permission.CALL_PHONE,
                          Manifest.permission.RECORD_AUDIO
                      )
                      ActivityCompat.requestPermissions(this, permissions, PERMISSION_REQUEST_CODE)
                  } catch (e: Exception) {
                      e.printStackTrace()
                  }
              }

              private fun triggerHaptic() {
                  try {
                      val vibrator = getSystemService(Context.VIBRATOR_SERVICE) as? Vibrator
                      if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.O) {
                          vibrator?.vibrate(VibrationEffect.createOneShot(50, VibrationEffect.DEFAULT_AMPLITUDE))
                      } else {
                          vibrator?.vibrate(50)
                      }
                  } catch (e: Exception) {}
              }

              private fun syncContactsWithMappings() {
                  try {
                      allContacts.clear()
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_CONTACTS) == PackageManager.PERMISSION_GRANTED) {
                          val cursor: Cursor? = contentResolver.query(
                              ContactsContract.CommonDataKinds.Phone.CONTENT_URI,
                              null, null, null, ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME + " ASC"
                          )
                          cursor?.let {
                              val nameIdx = it.getColumnIndex(ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME)
                              val numIdx = it.getColumnIndex(ContactsContract.CommonDataKinds.Phone.NUMBER)
                              while (it.moveToNext()) {
                                  val name = it.getString(nameIdx) ?: ""
                                  val num = it.getString(numIdx) ?: ""
                                  if (name.isNotEmpty() && num.isNotEmpty()) {
                                      if (!allContacts.any { c -> c.phone == num }) {
                                          val savedAlias = sharedPrefs.getString("alias_$num", "") ?: ""
                                          val shown = savedAlias.isNotEmpty()
                                          allContacts.add(ContactItem(name, num, savedAlias, shown))
                                      }
                                  }
                              }
                              it.close()
                          }
                      }
                  } catch (e: Exception) {
                      e.printStackTrace()
                  }
              }

              // 🔥 DIRECTORY & MAPPING SCREEN (Opened via CONTACTS tab) 🔥
              private fun showDirectoryScreen() {
                  syncContactsWithMappings()

                  val dialogView = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(Color.parseColor("#0B1315"))
                      setPadding(30, 30, 30, 30)
                  }

                  val titleTv = TextView(this).apply {
                      text = "👑 Manage Contacts (Green = Shown)"
                      setTextColor(Color.parseColor("#38BDF8"))
                      textSize = 18f
                      setPadding(0, 0, 0, 20)
                      gravity = Gravity.CENTER
                  }
                  dialogView.addView(titleTv)

                  val scrollView = ScrollView(this).apply {
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          1200
                      )
                  }

                  val containerLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                  }
                  scrollView.addView(containerLayout)
                  dialogView.addView(scrollView)

                  for (contact in allContacts) {
                      val itemLayout = LinearLayout(this).apply {
                          orientation = LinearLayout.VERTICAL
                          setPadding(20, 20, 20, 20)
                          // Green indicator background if shown (#064E3B), else dark glass card (#16202A)
                          setBackgroundColor(if (contact.isShown) Color.parseColor("#064E3B") else Color.parseColor("#16202A"))
                          val params = LinearLayout.LayoutParams(
                              LinearLayout.LayoutParams.MATCH_PARENT,
                              LinearLayout.LayoutParams.WRAP_CONTENT
                          )
                          params.setMargins(0, 0, 0, 15)
                          layoutParams = params
                      }

                      val nameTv = TextView(this).apply {
                          text = "Name: ${contact.name}"
                          setTextColor(Color.parseColor("#FFFFFF"))
                          textSize = 15f
                          textStyle = android.graphics.Typeface.BOLD
                      }

                      val detailsTv = TextView(this).apply {
                          text = "Phone: ${contact.phone} | Mapped: ${if(contact.isShown) contact.mappedAlias else "Not Shown"}"
                          setTextColor(if (contact.isShown) Color.parseColor("#86EFAC") else Color.parseColor("#94A3B8"))
                          textSize = 13f
                      }

                      itemLayout.addView(nameTv)
                      itemLayout.addView(detailsTv)

                      itemLayout.setOnClickListener {
                          showMappingDialog(contact)
                      }

                      containerLayout.addView(itemLayout)
                  }

                  val closeBtn = Button(this).apply {
                      text = "Back to Assistant"
                      setBackgroundColor(Color.parseColor("#38BDF8"))
                      setTextColor(Color.parseColor("#0B1315"))
                      setPadding(20, 10, 20, 10)
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      ).apply { topMargin = 20 }
                  }

                  dialogView.addView(closeBtn)

                  val dialog = AlertDialog.Builder(this)
                      .setView(dialogView)
                      .create()

                  closeBtn.setOnClickListener { dialog.dismiss() }
                  dialog.show()
              }

              // 🔥 MAPPING DIALOG WITH VOICE-TYPING MIC & SHOW BUTTON 🔥
              private fun showMappingDialog(contact: ContactItem) {
                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(Color.parseColor("#16202A"))
                      setPadding(40, 40, 40, 40)
                  }

                  val infoTv = TextView(this).apply {
                      text = "Map Voice Name for:\n${contact.name}\n(${contact.phone})"
                      setTextColor(Color.parseColor("#FFFFFF"))
                      textSize = 16f
                      setPadding(0, 0, 0, 20)
                  }
                  layout.addView(infoTv)

                  val rowLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }

                  val aliasInput = EditText(this).apply {
                      hint = "Type or speak name (e.g. Appu)"
                      setText(contact.mappedAlias)
                      setTextColor(Color.parseColor("#FFFFFF"))
                      setHintTextColor(Color.parseColor("#94A3B8"))
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                  }
                  rowLayout.addView(aliasInput)

                  // Voice Type Mic Button inside Mapping Dialog
                  val smallMicBtn = ImageButton(this).apply {
                      setImageResource(android.R.drawable.ic_btn_speak_now)
                      setBackgroundColor(Color.parseColor("#0369A1"))
                      setPadding(15, 15, 15, 15)
                      contentDescription = "Voice Type"
                      layoutParams = LinearLayout.LayoutParams(100, 100).apply { leftMargin = 10 }
                  }
                  rowLayout.addView(smallMicBtn)
                  layout.addView(rowLayout)

                  smallMicBtn.setOnClickListener {
                      triggerHaptic()
                      Toast.makeText(this, "Listening for name...", Toast.LENGTH_SHORT).show()
                      val voiceIntent = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                          putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                          putExtra(RecognizerIntent.EXTRA_LANGUAGE, Locale.getDefault().toString())
                          putExtra(RecognizerIntent.EXTRA_MAX_RESULTS, 1)
                      }
                      val tempRecognizer = SpeechRecognizer.createSpeechRecognizer(applicationContext)
                      tempRecognizer.setRecognitionListener(object : RecognitionListener {
                          override fun onReadyForSpeech(params: Bundle?) {}
                          override fun onBeginningOfSpeech() {}
                          override fun onRmsChanged(rmsdB: Float) {}
                          override fun onBufferReceived(buffer: ByteArray?) {}
                          override fun onEndOfSpeech() {}
                          override fun onError(error: Int) {
                              Toast.makeText(this@MainActivity, "Voice capture failed", Toast.LENGTH_SHORT).show()
                          }
                          override fun onResults(results: Bundle?) {
                              val matches = results?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)
                              if (!matches.isNullOrEmpty()) {
                                  aliasInput.setText(matches[0].trim())
                              }
                          }
                          override fun onPartialResults(partialResults: Bundle?) {}
                          override fun onEvent(eventType: Int, params: Bundle?) {}
                      })
                      tempRecognizer.startListening(voiceIntent)
                  }

                  val showBtn = Button(this).apply {
                      text = "SHOW (Save Mapped Name)"
                      setBackgroundColor(Color.parseColor("#4ADE80"))
                      setTextColor(Color.parseColor("#0B1315"))
                      textStyle = android.graphics.Typeface.BOLD
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      ).apply { topMargin = 30 }
                  }
                  layout.addView(showBtn)

                  val mapDialog = AlertDialog.Builder(this)
                      .setView(layout)
                      .create()

                  showBtn.setOnClickListener {
                      val newAlias = aliasInput.text.toString().trim().lowercase(Locale.ROOT)
                      if (newAlias.isNotEmpty()) {
                          sharedPrefs.edit().putString("alias_${contact.phone}", newAlias).apply()
                          Toast.makeText(this, "Successfully Shown & Saved!", Toast.LENGTH_SHORT).show()
                          mapDialog.dismiss()
                          showDirectoryScreen()
                      } else {
                          Toast.makeText(this, "Please enter or speak a valid name.", Toast.LENGTH_SHORT).show()
                      }
                  }

                  mapDialog.show()
              }

              private fun setupSpeechRecognizer() {
                  try {
                      if (SpeechRecognizer.isRecognitionAvailable(this)) {
                          try {
                              speechRecognizer?.destroy()
                          } catch (e: Exception) {}

                          speechRecognizer = SpeechRecognizer.createSpeechRecognizer(applicationContext)
                          speechRecognizer?.setRecognitionListener(object : RecognitionListener {
                              override fun onReadyForSpeech(params: Bundle?) {
                                  statusTitleTv.text = "Listening..."
                                  statusDescTv.text = "Listening for mapped name..."
                                  waveTv.text = " ıllılıl llılıll "
                              }
                              override fun onBeginningOfSpeech() {}
                              override fun onRmsChanged(rmsdB: Float) {}
                              override fun onBufferReceived(buffer: ByteArray?) {}
                              override fun onEndOfSpeech() {
                                  statusTitleTv.text = "Processing..."
                                  statusDescTv.text = "Matching directory..."
                              }
                              override fun onError(error: Int) {
                                  resetMicState()
                                  statusTitleTv.text = "AI Assistant Ready"
                                  statusDescTv.text = "Tap mic to speak."
                              }
                              override fun onResults(results: Bundle?) {
                                  resetMicState()
                                  val matches = results?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)
                                  if (!matches.isNullOrEmpty()) {
                                      processMappedVoiceCommand(matches[0])
                                  } else {
                                      statusTitleTv.text = "AI Assistant Ready"
                                      statusDescTv.text = "Kuch sunai nahi diya."
                                  }
                              }
                              override fun onPartialResults(partialResults: Bundle?) {}
                              override fun onEvent(eventType: Int, params: Bundle?) {}
                          })
                      }
                  } catch (e: Exception) {
                      e.printStackTrace()
                  }
              }

              private fun startListeningProcess() {
                  try {
                      if (::textToSpeech.isInitialized) {
                          textToSpeech.stop()
                      }

                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED) {
                          btnMic.setBackgroundResource(R.drawable.circle_mic_active)
                          if (speechRecognizer == null) {
                              setupSpeechRecognizer()
                          }
                          
                          val intent = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                              putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                              putExtra(RecognizerIntent.EXTRA_LANGUAGE, Locale.getDefault().toString())
                              putExtra(RecognizerIntent.EXTRA_MAX_RESULTS, 5)
                              putExtra(RecognizerIntent.EXTRA_PREFER_OFFLINE, true)
                          }
                          speechRecognizer?.startListening(intent)
                      } else {
                          checkPermissions()
                      }
                  } catch (e: Exception) {
                      resetMicState()
                      Toast.makeText(this, "Microphone error. Try again.", Toast.LENGTH_SHORT).show()
                  }
              }

              private fun resetMicState() {
                  btnMic.setBackgroundResource(R.drawable.circle_mic_normal)
                  statusTitleTv.text = "AI Assistant Ready"
                  statusDescTv.text = "Tap mic and speak naturally"
                  waveTv.text = " ıllılıl llılıll "
              }

              private fun processMappedVoiceCommand(spokenText: String) {
                  try {
                      val query = spokenText.trim().lowercase(Locale.ROOT)
                      syncContactsWithMappings()

                      var matchedContact: ContactItem? = null
                      for (contact in allContacts) {
                          if (contact.isShown && contact.mappedAlias.isNotEmpty()) {
                              if (query.contains(contact.mappedAlias) || contact.mappedAlias.contains(query)) {
                                  matchedContact = contact
                                  break
                              }
                          }
                      }

                      if (matchedContact != null) {
                          statusTitleTv.text = "Calling ${matchedContact.name}..."
                          statusDescTv.text = matchedContact.phone
                          speakOut("Calling ${matchedContact.mappedAlias}")
                          makePhoneCall(matchedContact.phone)
                      } else {
                          statusTitleTv.text = "Not Shown"
                          statusDescTv.text = "\"$spokenText\" directory me shown nahi hai."
                          speakOut("$spokenText naam directory me shown nahi hai.")
                      }
                  } catch (e: Exception) {
                      statusTitleTv.text = "AI Assistant Ready"
                      statusDescTv.text = "Try again."
                  }
              }

              private fun speakOut(text: String) {
                  try {
                      textToSpeech.setSpeechRate(1.0f)
                      textToSpeech.speak(text, TextToSpeech.QUEUE_FLUSH, null, "")
                  } catch (e: Exception) {}
              }

              private fun makePhoneCall(phoneNumber: String) {
                  try {
                      if (::textToSpeech.isInitialized) {
                          textToSpeech.stop()
                      }
                      moveTaskToBack(true)
                      val intent = Intent(Intent.ACTION_CALL).apply {
                          data = Uri.parse("tel:$phoneNumber")
                      }
                      if (ActivityCompat.checkSelfPermission(this, Manifest.permission.CALL_PHONE) == PackageManager.PERMISSION_GRANTED) {
                          startActivity(intent)
                      } else {
                          val dialIntent = Intent(Intent.ACTION_DIAL).apply {
                              data = Uri.parse("tel:$phoneNumber")
                          }
                          startActivity(dialIntent)
                      }
                  } catch (e: Exception) {
                      Toast.makeText(this, "Call error.", Toast.LENGTH_SHORT).show()
                  }
              }

              override fun onInit(status: Int) {
                  if (status == TextToSpeech.SUCCESS) {
                      try {
                          textToSpeech.language = Locale("en", "IN")
                      } catch (e: Exception) {}
                  }
              }

              override fun onDestroy() {
                  try {
                      speechRecognizer?.destroy()
                  } catch (e: Exception) {}
                  try {
                      if (::textToSpeech.isInitialized) {
                          textToSpeech.stop()
                          textToSpeech.shutdown()
                      }
                  } catch (e: Exception) {}
                  super.onDestroy()
              }
          }
          EOF

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Z-Plus-2-Assistant-Call-APK
          path: app/build/outputs/apk/debug/app-debug.apk

