name: Build Zeeshan Mic Assistant APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 🔥 यहाँ एंड्राइड SDK सेटअप जोड़ा गया है ताकि बिल्ड कभी फेल न हो!
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Build Tools & Platform
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: Generate Build Configurations
        run: |
          set -euo pipefail
          mkdir -p app/src/main/java/com/zeeshan/micassistant
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/layout

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.daemon=false
          EOF

          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "ZeeshanMicAssistant"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id "com.android.application" version "8.2.2" apply false
              id "org.jetbrains.kotlin.android" version "1.9.22" apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id "com.android.application"
              id "org.jetbrains.kotlin.android"
          }
          android {
              namespace "com.zeeshan.micassistant"
              compileSdk 34
              defaultConfig {
                  applicationId "com.zeeshan.micassistant"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes { release { minifyEnabled false } }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation "androidx.core:core-ktx:1.13.1"
              implementation "androidx.appcompat:appcompat:1.7.0"
              implementation "com.google.android.material:material:1.12.0"
          }
          EOF

      - name: Generate App Resources, Icons & Manifest
        run: |
          set -euo pipefail

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">जीशान माइक असिस्टेंट</string>
          </resources>
          EOF

          # 🎨 VIP ब्लू & व्हाइट ऐप आइकॉन (Vector Drawable)
          cat > app/src/main/res/drawable/ic_app_icon.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#1E3A8A"
                  android:pathData="M12,2C6.48,2 2,6.48 2,12s4.48,10 10,10 10,-4.48 10,-10S17.52,2 12,2z"/>
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M12,14c1.66,0 3,-1.34 3,-3V5c0,-1.66 -1.34,-3 -3,-3S9,3.34 9,5v6c0,1.66 1.34,3 3,3zM17.1,11c0,2.76 -2.24,5 -5,5s-5,-2.24 -5,-5H5c0,3.53 2.61,6.43 6,6.92V21h2v-3.08c3.39,-0.49 6,-3.39 6,-6.92h-1.9z"/>
          </vector>
          EOF

          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:background="#F8FAFC">

              <!-- हेडर पट्टी (Blue Header Bar) -->
              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="65dp"
                  android:background="#1E3A8A"
                  android:gravity="center"
                  android:elevation="4dp">
                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="🎙️ जीशान माइक असिस्टेंट कॉल"
                      android:textColor="#FFFFFF"
                      android:textSize="20sp"
                      android:textStyle="bold" />
              </LinearLayout>

              <!-- मुख्य बॉडी (White & Blue Content) -->
              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:orientation="vertical"
                  android:gravity="center"
                  android:padding="24dp">

                  <TextView
                      android:id="@+id/statusTv"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="ऐप तैयार है। माइक दबाकर बोलें..."
                      android:textColor="#1E3A8A"
                      android:textSize="16sp"
                      android:textStyle="bold"
                      android:gravity="center"
                      android:layout_marginBottom="30dp" />

                  <!-- माइक बटन (लार्ज सर्कुलर बटन) -->
                  <ImageButton
                      android:id="@+id/btnMic"
                      android:layout_width="130dp"
                      android:layout_height="130dp"
                      android:background="@drawable/circle_mic_normal"
                      android:src="@android:drawable/ic_btn_speak_now"
                      android:scaleType="centerInside"
                      android:elevation="8dp"
                      android:contentDescription="Mic Button"
                      android:layout_marginBottom="20dp" />

                  <!-- फ्रीक्वेंसी वेब्स सिमुलेशन (Frequency Waveform) -->
                  <TextView
                      android:id="@+id/waveTv"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text=" ~ ~ ıllılıl llılıll ~ ~ "
                      android:textColor="#94A3B8"
                      android:textSize="22sp"
                      android:letterSpacing="0.2"
                      android:layout_marginBottom="30dp" />

                  <!-- कॉन्टैक्ट्स लिस्ट -->
                  <ListView
                      android:id="@+id/listView"
                      android:layout_width="match_parent"
                      android:layout_height="0dp"
                      android:layout_weight="1"
                      android:background="@drawable/list_background"
                      android:padding="8dp" />

              </LinearLayout>
          </LinearLayout>
          EOF

          cat > app/src/main/res/drawable/circle_mic_normal.xml <<'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="oval">
              <solid android:color="#1E3A8A" />
          </shape>
          EOF

          cat > app/src/main/res/drawable/circle_mic_active.xml <<'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="oval">
              <solid android:color="#EF4444" />
          </shape>
          EOF

          cat > app/src/main/res/drawable/list_background.xml <<'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#FFFFFF" />
              <corners android:radius="16dp" />
              <stroke android:width="1dp" android:color="#CBD5E1" />
          </shape>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.READ_CONTACTS" />
              <uses-permission android:name="android.permission.READ_CALL_LOG" />
              <uses-permission android:name="android.permission.CALL_PHONE" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />

              <application
                  android:allowBackup="false"
                  android:icon="@drawable/ic_app_icon"
                  android:roundIcon="@drawable/ic_app_icon"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Write MainActivity.kt with Smart Voice, Barge-in & Sync Logic
        run: |
          cat > app/src/main/java/com/zeeshan/micassistant/MainActivity.kt <<'EOF'
          package com.zeeshan.micassistant

          import android.Manifest
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.database.Cursor
          import android.net.Uri
          import android.os.Bundle
          import android.provider.CallLog
          import android.provider.ContactsContract
          import android.speech.RecognitionListener
          import android.speech.RecognizerIntent
          import android.speech.SpeechRecognizer
          import android.speech.tts.TextToSpeech
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat
          import java.util.*

          data class ContactItem(val name: String, val phone: String)

          class MainActivity : AppCompatActivity(), TextToSpeech.OnInitListener {

              private lateinit var btnMic: ImageButton
              private lateinit var statusTv: TextView
              private lateinit var waveTv: TextView
              private lateinit var listView: ListView

              private lateinit var speechRecognizer: SpeechRecognizer
              private lateinit var textToSpeech: TextToSpeech
              
              private val allContacts = mutableListOf<ContactItem>()
              private val displayList = ArrayList<String>()
              private lateinit var listAdapter: ArrayAdapter<String>
              
              private var isSpeakingNames = false

              companion object {
                  private const val REQ_CODE = 101
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  btnMic = findViewById(R.id.btnMic)
                  statusTv = findViewById(R.id.statusTv)
                  waveTv = findViewById(R.id.waveTv)
                  listView = findViewById(R.id.listView)

                  listAdapter = ArrayAdapter(this, android.R.layout.simple_list_item_1, displayList)
                  listView.adapter = listAdapter

                  checkPermissions()
                  syncContactsAndCallLog()

                  textToSpeech = TextToSpeech(this, this)
                  setupSpeechRecognizer()

                  btnMic.setOnClickListener {
                      startVoiceListening()
                  }
              }

              private fun checkPermissions() {
                  val perms = arrayOf(
                      Manifest.permission.READ_CONTACTS,
                      Manifest.permission.READ_CALL_LOG,
                      Manifest.permission.CALL_PHONE,
                      Manifest.permission.RECORD_AUDIO
                  )
                  ActivityCompat.requestPermissions(this, perms, REQ_CODE)
              }

              private fun syncContactsAndCallLog() {
                  allContacts.clear()
                  displayList.clear()

                  // 1. कांटेक्ट बुक स्कैन करें
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_CONTACTS) == PackageManager.PERMISSION_GRANTED) {
                      val cursor: Cursor? = contentResolver.query(
                          ContactsContract.CommonDataKinds.Phone.CONTENT_URI,
                          null, null, null, ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME + " ASC"
                      )
                      cursor?.let {
                          val nameIdx = it.getColumnIndex(ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME)
                          val numIdx = it.getColumnIndex(ContactsContract.CommonDataKinds.Phone.NUMBER)
                          while (it.moveToNext()) {
                              val name = it.getString(nameIdx) ?: ""
                              val num = it.getString(numIdx) ?: ""
                              if (name.isNotEmpty() && num.isNotEmpty()) {
                                  if (!allContacts.any { c -> c.phone == num }) {
                                      allContacts.add(ContactItem(name, num))
                                  }
                              }
                          }
                          it.close()
                      }
                  }

                  // 2. कॉल लॉग (Call History) से नए नंबर स्कैन करें
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_CALL_LOG) == PackageManager.PERMISSION_GRANTED) {
                      val logCursor: Cursor? = contentResolver.query(
                          CallLog.Calls.CONTENT_URI,
                          arrayOf(CallLog.Calls.CACHED_NAME, CallLog.Calls.NUMBER),
                          null, null, CallLog.Calls.DATE + " DESC"
                      )
                      logCursor?.let {
                          val nameIdx = it.getColumnIndex(CallLog.Calls.CACHED_NAME)
                          val numIdx = it.getColumnIndex(CallLog.Calls.NUMBER)
                          while (it.moveToNext()) {
                              val name = it.getString(nameIdx) ?: "Unknown Caller"
                              val num = it.getString(numIdx) ?: ""
                              if (num.isNotEmpty() && !allContacts.any { c -> c.phone == num }) {
                                  allContacts.add(ContactItem(name, num))
                              }
                          }
                          it.close()
                      }
                  }

                  for (c in allContacts.take(20)) {
                      displayList.add("📞 ${c.name} (${c.phone})")
                  }
                  listAdapter.notifyDataSetChanged()
                  statusTv.text = "कुल ${allContacts.size} कॉन्टैक्ट्स सिंक हो गए हैं। माइक दबाएं!"
              }

              private fun setupSpeechRecognizer() {
                  speechRecognizer = SpeechRecognizer.createSpeechRecognizer(this)
                  speechRecognizer.setRecognitionListener(object : RecognitionListener {
                      override fun onReadyForSpeech(params: Bundle?) {}
                      override fun onBeginningOfSpeech() {
                          // ⚡ Barge-in: अगर ऐप नाम बोल रहा है और यूजर बीच में बोल पड़े, तो TTS तुरंत चुप हो जाएगा!
                          if (isSpeakingNames) {
                              textToSpeech.stop()
                              isSpeakingNames = false
                          }
                      }
                      override fun onRmsChanged(rmsdB: Float) {}
                      override fun onBufferReceived(buffer: ByteArray?) {}
                      override fun onEndOfSpeech() {
                          btnMic.setBackgroundResource(R.drawable.circle_mic_normal)
                          waveTv.text = " ~ ~ ıllılıl llılıll ~ ~ "
                      }
                      override fun onError(error: Int) {
                          btnMic.setBackgroundResource(R.drawable.circle_mic_normal)
                          statusTv.text = "आवाज़ सुनाई नहीं दी, पुनः प्रयास करें।"
                      }
                      override fun onResults(results: Bundle?) {
                          btnMic.setBackgroundResource(R.drawable.circle_mic_normal)
                          val matches = results?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)
                          if (!matches.isNullOrEmpty()) {
                              processCommand(matches[0])
                          }
                      }
                      override fun onPartialResults(partialResults: Bundle?) {}
                      override fun onEvent(eventType: Int, params: Bundle?) {}
                  })
              }

              private fun startVoiceListening() {
                  btnMic.setBackgroundResource(R.drawable.circle_mic_active) // 🔴 माइक बटन लाल हो जाएगा
                  waveTv.text = "🔴 सुन रहा हूँ... बोलिए..."
                  statusTv.text = "बोलिए किसे कॉल करना है..."

                  val intent = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                      putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                      putExtra(RecognizerIntent.EXTRA_LANGUAGE, "hi-IN")
                  }
                  speechRecognizer.startListening(intent)
              }

              private fun processCommand(command: String) {
                  val query = command.replace("को कॉल लगाओ", "")
                      .replace("फोन लगाओ", "")
                      .replace("कॉन्टेक्ट", "")
                      .trim()

                  statusTv.text = "सुना गया: \"$query\""

                  val matched = allContacts.filter { it.name.contains(query, ignoreCase = true) }

                  when {
                      matched.isEmpty() -> {
                          speakOut("इस नाम का कोई व्यक्ति नहीं मिला।")
                      }
                      matched.size == 1 -> {
                          speakOut("${matched[0].name} को कॉल लगाया जा रहा है।")
                          makeCall(matched[0].phone)
                      }
                      else -> {
                          // अगर 10 नाम मिले (जैसे सलमान)
                          var speechText = "इस नाम के ${matched.size} लोग मिले हैं। "
                          displayList.clear()
                          matched.forEachIndexed { idx, contact ->
                              speechText += "नंबर ${idx + 1}: ${contact.name}. "
                              displayList.add("🔸 ${idx + 1}. ${contact.name} (${contact.phone})")
                          }
                          listAdapter.notifyDataSetChanged()
                          speakOut(speechText)
                      }
                  }
              }

              private fun speakOut(text: String) {
                  isSpeakingNames = true
                  textToSpeech.speak(text, TextToSpeech.QUEUE_FLUSH, null, "")
              }

              private fun makeCall(phoneNumber: String) {
                  val intent = Intent(Intent.ACTION_CALL).apply {
                      data = Uri.parse("tel:$phoneNumber")
                  }
                  if (ActivityCompat.checkSelfPermission(this, Manifest.permission.CALL_PHONE) == PackageManager.PERMISSION_GRANTED) {
                      startActivity(intent)
                  }
              }

              override fun onInit(status: Int) {
                  if (status == TextToSpeech.SUCCESS) {
                      textToSpeech.language = Locale("hi", "IN")
                  }
              }

              override fun onDestroy() {
                  if (::speechRecognizer.isInitialized) speechRecognizer.destroy()
                  if (::textToSpeech.isInitialized) {
                      textToSpeech.stop()
                      textToSpeech.shutdown()
                  }
                  super.onDestroy()
              }
          }
          EOF

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zeeshan-Mic-Assistant-APK
          path: app/build/outputs/apk/debug/app-debug.apk

