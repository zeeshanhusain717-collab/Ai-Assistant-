name: Build Zeeshan Mic Assistant APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: Generate Build Configurations
        run: |
          set -euo pipefail
          mkdir -p app/src/main/java/com/zeeshan/micassistant
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/menu

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.daemon=false
          EOF

          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "ZeeshanMicAssistant"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id "com.android.application" version "8.2.2" apply false
              id "org.jetbrains.kotlin.android" version "1.9.22" apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id "com.android.application"
              id "org.jetbrains.kotlin.android"
          }
          android {
              namespace "com.zeeshan.micassistant"
              compileSdk 34
              defaultConfig {
                  applicationId "com.zeeshan.micassistant"
                  minSdk 26
                  targetSdk 34
                  versionCode 2
                  versionName "2.0"
              }
              buildTypes { release { minifyEnabled false } }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation "androidx.core:core-ktx:1.13.1"
              implementation "androidx.appcompat:appcompat:1.7.0"
              implementation "com.google.android.material:material:1.12.0"
              implementation "androidx.drawerlayout:drawerlayout:1.2.0"
          }
          EOF

      - name: Generate App Resources & Manifest
        run: |
          set -euo pipefail

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Zeeshan Mic Assistant</string>
              <string name="navigation_drawer_open">Open navigation drawer</string>
              <string name="navigation_drawer_close">Close navigation drawer</string>
          </resources>
          EOF

          cat > app/src/main/res/drawable/ic_app_icon.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path android:fillColor="#1E3A8A" android:pathData="M12,2C6.48,2 2,6.48 2,12s4.48,10 10,10 10,-4.48 10,-10S17.52,2 12,2z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M12,14c1.66,0 3,-1.34 3,-3V5c0,-1.66 -1.34,-3 -3,-3S9,3.34 9,5v6c0,1.66 1.34,3 3,3zM17.1,11c0,2.76 -2.24,5 -5,5s-5,-2.24 -5,-5H5c0,3.53 2.61,6.43 6,6.92V21h2v-3.08c3.39,-0.49 6,-3.39 6,-6.92h-1.9z"/>
          </vector>
          EOF

          cat > app/src/main/res/drawable/circle_mic_normal.xml <<'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
              <solid android:color="#1E3A8A" />
          </shape>
          EOF

          cat > app/src/main/res/drawable/circle_mic_active.xml <<'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
              <solid android:color="#EF4444" />
          </shape>
          EOF

          cat > app/src/main/res/drawable/list_background.xml <<'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#FFFFFF" />
              <corners android:radius="16dp" />
              <stroke android:width="1dp" android:color="#CBD5E1" />
          </shape>
          EOF

          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <androidx.drawerlayout.widget.DrawerLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/drawerLayout"
              android:layout_width="match_parent"
              android:layout_height="match_parent">

              <!-- Main Home Screen -->
              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:orientation="vertical"
                  android:background="#F8FAFC">

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="65dp"
                      android:background="#1E3A8A"
                      android:gravity="center_vertical"
                      android:paddingHorizontal="16dp"
                      android:elevation="4dp">
                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="🎙️ Zeeshan Mic Assistant (ZED)"
                          android:textColor="#FFFFFF"
                          android:textSize="18sp"
                          android:textStyle="bold" />
                  </LinearLayout>

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="match_parent"
                      android:orientation="vertical"
                      android:gravity="center"
                      android:padding="24dp">

                      <TextView
                          android:id="@+id/statusTv"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="ZED is ready. Tap mic and speak..."
                          android:textColor="#1E3A8A"
                          android:textSize="16sp"
                          android:textStyle="bold"
                          android:gravity="center"
                          android:layout_marginBottom="30dp" />

                      <ImageButton
                          android:id="@+id/btnMic"
                          android:layout_width="130dp"
                          android:layout_height="130dp"
                          android:background="@drawable/circle_mic_normal"
                          android:src="@android:drawable/ic_btn_speak_now"
                          android:scaleType="centerInside"
                          android:elevation="8dp"
                          android:contentDescription="Mic Button"
                          android:layout_marginBottom="20dp" />

                      <TextView
                          android:id="@+id/waveTv"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text=" ~ ~ ıllılıl llılıll ~ ~ "
                          android:textColor="#94A3B8"
                          android:textSize="22sp"
                          android:letterSpacing="0.2"
                          android:layout_marginBottom="30dp" />

                      <ListView
                          android:id="@+id/listView"
                          android:layout_width="match_parent"
                          android:layout_height="0dp"
                          android:layout_weight="1"
                          android:background="@drawable/list_background"
                          android:padding="8dp" />

                  </LinearLayout>
              </LinearLayout>

              <!-- Side Navigation Drawer (Swipe to open for full synced list) -->
              <LinearLayout
                  android:layout_width="300dp"
                  android:layout_height="match_parent"
                  android:layout_gravity="start"
                  android:background="#FFFFFF"
                  android:orientation="vertical"
                  android:padding="16dp">

                  <TextView
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="📂 Synced Contacts &amp; History"
                      android:textColor="#1E3A8A"
                      android:textSize="18sp"
                      android:textStyle="bold"
                      android:paddingBottom="12dp" />

                  <ListView
                      android:id="@+id/navDrawerList"
                      android:layout_width="match_parent"
                      android:layout_height="match_parent" />

              </LinearLayout>

          </androidx.drawerlayout.widget.DrawerLayout>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.READ_CONTACTS" />
              <uses-permission android:name="android.permission.READ_CALL_LOG" />
              <uses-permission android:name="android.permission.CALL_PHONE" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />

              <application
                  android:allowBackup="false"
                  android:icon="@drawable/ic_app_icon"
                  android:roundIcon="@drawable/ic_app_icon"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Write Pure Kotlin MainActivity.kt with ZED AI & Drawer Support
        run: |
          cat > app/src/main/java/com/zeeshan/micassistant/MainActivity.kt <<'EOF'
          package com.zeeshan.micassistant

          import android.Manifest
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.database.Cursor
          import android.net.Uri
          import android.os.Bundle
          import android.provider.CallLog
          import android.provider.ContactsContract
          import android.speech.RecognitionListener
          import android.speech.RecognizerIntent
          import android.speech.SpeechRecognizer
          import android.speech.tts.TextToSpeech
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat
          import androidx.drawerlayout.widget.DrawerLayout
          import java.util.*

          data class ContactItem(val name: String, val phone: String)

          class MainActivity : AppCompatActivity(), TextToSpeech.OnInitListener {

              private lateinit var btnMic: ImageButton
              private lateinit var statusTv: TextView
              private lateinit var waveTv: TextView
              private lateinit var listView: ListView
              private lateinit var drawerLayout: DrawerLayout
              private lateinit var navDrawerList: ListView

              private lateinit var speechRecognizer: SpeechRecognizer
              private lateinit var textToSpeech: TextToSpeech

              private val allContacts = mutableListOf<ContactItem>()
              private val displayList = ArrayList<String>()
              private val drawerListItems = ArrayList<String>()
              
              private lateinit var listAdapter: ArrayAdapter<String>
              private lateinit var drawerAdapter: ArrayAdapter<String>

              private var isSpeakingNames = false

              companion object {
                  private const val PERMISSION_REQUEST_CODE = 101
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  btnMic = findViewById(R.id.btnMic)
                  statusTv = findViewById(R.id.statusTv)
                  waveTv = findViewById(R.id.waveTv)
                  listView = findViewById(R.id.listView)
                  drawerLayout = findViewById(R.id.drawerLayout)
                  navDrawerList = findViewById(R.id.navDrawerList)

                  listAdapter = ArrayAdapter(this, android.R.layout.simple_list_item_1, displayList)
                  listView.adapter = listAdapter

                  drawerAdapter = ArrayAdapter(this, android.R.layout.simple_list_item_1, drawerListItems)
                  navDrawerList.adapter = drawerAdapter

                  checkPermissions()
                  syncAllData()

                  textToSpeech = TextToSpeech(this, this)
                  setupSpeechRecognizer()

                  btnMic.setOnClickListener {
                      startVoiceListening()
                  }
              }

              private fun checkPermissions() {
                  val permissions = arrayOf(
                      Manifest.permission.READ_CONTACTS,
                      Manifest.permission.READ_CALL_LOG,
                      Manifest.permission.CALL_PHONE,
                      Manifest.permission.RECORD_AUDIO
                  )
                  ActivityCompat.requestPermissions(this, permissions, PERMISSION_REQUEST_CODE)
              }

              private fun syncAllData() {
                  allContacts.clear()
                  displayList.clear()
                  drawerListItems.clear()

                  // 1. Sync Phone Contacts
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_CONTACTS) == PackageManager.PERMISSION_GRANTED) {
                      val cursor: Cursor? = contentResolver.query(
                          ContactsContract.CommonDataKinds.Phone.CONTENT_URI,
                          null, null, null, ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME + " ASC"
                      )
                      cursor?.let {
                          val nameIdx = it.getColumnIndex(ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME)
                          val numIdx = it.getColumnIndex(ContactsContract.CommonDataKinds.Phone.NUMBER)
                          while (it.moveToNext()) {
                              val name = it.getString(nameIdx) ?: ""
                              val num = it.getString(numIdx) ?: ""
                              if (name.isNotEmpty() && num.isNotEmpty()) {
                                  if (!allContacts.any { c -> c.phone == num }) {
                                      allContacts.add(ContactItem(name, num))
                                  }
                              }
                          }
                          it.close()
                      }
                  }

                  // 2. Sync Call History / Call Log
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_CALL_LOG) == PackageManager.PERMISSION_GRANTED) {
                      val logCursor: Cursor? = contentResolver.query(
                          CallLog.Calls.CONTENT_URI,
                          arrayOf(CallLog.Calls.CACHED_NAME, CallLog.Calls.NUMBER),
                          null, null, CallLog.Calls.DATE + " DESC"
                      )
                      logCursor?.let {
                          val nameIdx = it.getColumnIndex(CallLog.Calls.CACHED_NAME)
                          val numIdx = it.getColumnIndex(CallLog.Calls.NUMBER)
                          while (it.moveToNext()) {
                              val name = it.getString(nameIdx) ?: "Unknown Caller"
                              val num = it.getString(numIdx) ?: ""
                              if (num.isNotEmpty() && !allContacts.any { c -> c.phone == num }) {
                                  allContacts.add(ContactItem(name, num))
                              }
                          }
                          it.close()
                      }
                  }

                  for (contact in allContacts) {
                      drawerListItems.add("${contact.name}\n${contact.phone}")
                  }
                  drawerAdapter.notifyDataSetChanged()

                  for (contact in allContacts.take(15)) {
                      displayList.add("📞 ${contact.name} (${contact.phone})")
                  }
                  listAdapter.notifyDataSetChanged()

                  statusTv.text = "ZED synced ${allContacts.size} contacts. Tap mic!"
              }

              private fun setupSpeechRecognizer() {
                  speechRecognizer = SpeechRecognizer.createSpeechRecognizer(this)
                  speechRecognizer.setRecognitionListener(object : RecognitionListener {
                      override fun onReadyForSpeech(params: Bundle?) {}
                      override fun onBeginningOfSpeech() {
                          if (isSpeakingNames) {
                              textToSpeech.stop()
                              isSpeakingNames = false
                          }
                      }
                      override fun onRmsChanged(rmsdB: Float) {}
                      override fun onBufferReceived(buffer: ByteArray?) {}
                      override fun onEndOfSpeech() {
                          btnMic.setBackgroundResource(R.drawable.circle_mic_normal)
                          waveTv.text = " ~ ~ ıllılıl llılıll ~ ~ "
                      }
                      override fun onError(error: Int) {
                          btnMic.setBackgroundResource(R.drawable.circle_mic_normal)
                          statusTv.text = "Voice not detected. Try again."
                      }
                      override fun onResults(results: Bundle?) {
                          btnMic.setBackgroundResource(R.drawable.circle_mic_normal)
                          val matches = results?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)
                          if (!matches.isNullOrEmpty()) {
                              processZEDCommand(matches[0])
                          }
                      }
                      override fun onPartialResults(partialResults: Bundle?) {}
                      override fun onEvent(eventType: Int, params: Bundle?) {}
                  })
              }

              private fun startVoiceListening() {
                  btnMic.setBackgroundResource(R.drawable.circle_mic_active)
                  waveTv.text = "🔴 ZED is listening..."
                  statusTv.text = "Listening to your command..."

                  val intent = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                      putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                      putExtra(RecognizerIntent.EXTRA_LANGUAGE, "hi-IN")
                  }
                  speechRecognizer.startListening(intent)
              }

              private fun processZEDCommand(command: String) {
                  val query = command.replace("zed", "", ignoreCase = true)
                      .replace("को कॉल लगाओ", "")
                      .replace("फोन लगाओ", "")
                      .trim()

                  statusTv.text = "Understood: \"$query\""

                  val matched = allContacts.filter { it.name.contains(query, ignoreCase = true) }

                  when {
                      matched.isEmpty() -> {
                          speakOut("No contact found with this name.")
                      }
                      matched.size == 1 -> {
                          speakOut("Calling ${matched[0].name}")
                          makePhoneCall(matched[0].phone)
                      }
                      else -> {
                          var speechText = "Found ${matched.size} contacts matching this name. "
                          displayList.clear()
                          matched.forEachIndexed { index, contact ->
                              speechText += "Number ${index + 1}: ${contact.name}. "
                              displayList.add("🔸 ${index + 1}. ${contact.name} (${contact.phone})")
                          }
                          listAdapter.notifyDataSetChanged()
                          speakOut(speechText)
                      }
                  }
              }

              private fun speakOut(text: String) {
                  isSpeakingNames = true
                  textToSpeech.speak(text, TextToSpeech.QUEUE_FLUSH, null, "")
              }

              private fun makePhoneCall(phoneNumber: String) {
                  val intent = Intent(Intent.ACTION_CALL).apply {
                      data = Uri.parse("tel:$phoneNumber")
                  }
                  if (ActivityCompat.checkSelfPermission(this, Manifest.permission.CALL_PHONE) == PackageManager.PERMISSION_GRANTED) {
                      startActivity(intent)
                  }
              }

              override fun onInit(status: Int) {
                  if (status == TextToSpeech.SUCCESS) {
                      textToSpeech.language = Locale("hi", "IN")
                  }
              }

              override fun onDestroy() {
                  if (::speechRecognizer.isInitialized) speechRecognizer.destroy()
                  if (::textToSpeech.isInitialized) {
                      textToSpeech.stop()
                      textToSpeech.shutdown()
                  }
                  super.onDestroy()
              }
          }
          EOF

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zeeshan-Mic-Assistant-APK
          path: app/build/outputs/apk/debug/app-debug.apk

